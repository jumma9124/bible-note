<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일상</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f6fa;
      color: #222;
      height: 100vh;
      overflow: hidden;
    }

    /* ───────── 메인 (일상) ───────── */
    #view-main {
      padding: 52px 60px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .main-title {
      font-size: 2em;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: -0.02em;
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border: 1.5px solid #e4e8f5;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.13s;
      max-width: 480px;
    }
    .menu-item:hover {
      border-color: #2a4898;
      box-shadow: 0 2px 12px rgba(42,72,152,0.1);
      transform: translateX(3px);
    }
    .menu-num {
      font-size: 12px;
      font-weight: 700;
      color: #bbb;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .menu-name {
      font-size: 15px;
      font-weight: 600;
      color: #222;
      flex: 1;
    }
    .menu-arrow {
      color: #ccc;
      font-size: 16px;
    }
    .menu-item:hover .menu-arrow { color: #2a4898; }

    /* 추가 버튼 */
    .add-row {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 480px;
    }
    #add-input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px dashed #d0d6ea;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background: transparent;
      outline: none;
      display: none;
    }
    #add-input::placeholder { color: #ccc; }
    #add-input:focus { border-color: #2a4898; border-style: solid; }
    .btn-add-open {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      background: transparent;
      border: 1.5px dashed #d0d6ea;
      border-radius: 12px;
      font-size: 14px;
      color: #aaa;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.13s;
      max-width: 480px;
      width: 100%;
    }
    .btn-add-open:hover { border-color: #2a4898; color: #2a4898; }
    .btn-add-confirm {
      display: none;
      padding: 14px 20px;
      background: #2a4898;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-add-confirm:hover { background: #1a3570; }

    /* ───────── 성경필사 홈 ───────── */
    #view-bible {
      padding: 32px 44px;
      height: 100vh;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .back-to-main {
      font-size: 12px;
      color: #999;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .back-to-main:hover { color: #2a4898; }
    .bible-title {
      font-size: 1.4em;
      font-weight: 700;
      color: #1a3570;
    }
    .testament-block { display: flex; flex-direction: column; gap: 10px; }
    .testament-label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .book-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .book-btn {
      padding: 8px 14px;
      background: #fff;
      border: 1.5px solid #dce3f5;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #2a4898;
      cursor: pointer;
      transition: all 0.13s;
      min-width: 66px;
      text-align: center;
    }
    .book-btn:hover { background: #2a4898; color: #fff; border-color: #2a4898; }
    .book-btn.written { background: #eef1ff; border-color: #a8b8ef; }

    /* ───────── 책 상세 ───────── */
    #view-book { display: none; height: 100vh; }
    .book-layout { display: flex; height: 100%; }

    .sidebar {
      width: 210px;
      min-width: 210px;
      background: #fff;
      border-right: 1px solid #e4e9f5;
      display: flex;
      flex-direction: column;
    }
    .sidebar-top {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #e4e9f5;
    }
    .back-btn {
      font-size: 12px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .back-btn:hover { color: #2a4898; }
    .sidebar-book-name { font-size: 1.1em; font-weight: 700; color: #1a3570; }
    .chapter-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .chapter-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .chapter-item:hover { background: #f4f6ff; }
    .chapter-item.active { background: #eef1ff; border-left-color: #2a4898; }
    .ch-name { font-size: 13px; font-weight: 600; color: #2a4898; }
    .ch-date { font-size: 11px; color: #bbb; margin-top: 2px; }
    .sidebar-empty {
      padding: 20px 16px;
      font-size: 12px;
      color: #ccc;
      line-height: 1.7;
      text-align: center;
    }

    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #state-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .empty-text { font-size: 14px; color: #ccc; }
    .btn-write-main {
      padding: 13px 36px;
      background: #2a4898;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(42,72,152,0.22);
      transition: background 0.13s;
    }
    .btn-write-main:hover { background: #1a3570; }

    #state-read { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .read-topbar {
      padding: 24px 40px 18px;
      border-bottom: 1px solid #e4e9f5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .read-ch-title { font-size: 1.5em; font-weight: 700; color: #1a3570; }
    .read-ch-date { font-size: 12px; color: #bbb; margin-top: 4px; }
    .read-actions { display: flex; gap: 8px; }
    .btn-delete {
      padding: 7px 16px;
      background: #fff;
      border: 1.5px solid #f0d0d0;
      border-radius: 7px;
      font-size: 13px;
      color: #c0392b;
      cursor: pointer;
    }
    .btn-delete:hover { background: #fff0f0; border-color: #c0392b; }
    .btn-edit {
      padding: 7px 16px;
      background: #fff;
      border: 1.5px solid #dce3f5;
      border-radius: 7px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }
    .btn-edit:hover { background: #f0f3ff; color: #2a4898; border-color: #a8b8ef; }
    .btn-write-sm {
      padding: 7px 16px;
      background: #2a4898;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-write-sm:hover { background: #1a3570; }
    .read-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px 40px;
      font-size: 15px;
      line-height: 2.1;
      color: #333;
      white-space: pre-wrap;
    }

    #state-editor { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .editor-topbar {
      padding: 20px 40px 16px;
      border-bottom: 2px solid #e4e9f5;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #input-title {
      font-size: 1.5em;
      font-weight: 700;
      color: #1a3570;
      border: none;
      outline: none;
      background: transparent;
      width: 180px;
      font-family: inherit;
    }
    #input-title::placeholder { color: #ddd; font-weight: 400; }
    .editor-btns { margin-left: auto; display: flex; gap: 8px; }
    .btn-cancel {
      padding: 7px 14px;
      background: #fff;
      border: 1.5px solid #dce3f5;
      border-radius: 7px;
      font-size: 13px;
      color: #777;
      cursor: pointer;
    }
    .btn-cancel:hover { background: #f5f5f5; }
    .btn-save {
      padding: 7px 22px;
      background: #2a4898;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: #1a3570; }
    #input-content {
      flex: 1;
      padding: 24px 40px;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 2.1;
      color: #333;
      background: transparent;
      font-family: inherit;
    }
    #input-content::placeholder { color: #ddd; }
  </style>
</head>
<body>

<!-- ───── 일상 메인 ───── -->
<div id="view-main">
  <div class="main-title">일상</div>

  <div class="menu-list" id="menu-list"></div>

  <div class="add-row" id="add-row">
    <button class="btn-add-open" id="btn-add-open" onclick="toggleAddInput()">+ 새 항목 추가</button>
    <input id="add-input" type="text" placeholder="항목 이름 입력 후 Enter"
      onkeydown="if(event.key==='Enter') confirmAdd(); if(event.key==='Escape') toggleAddInput(false);" />
    <button class="btn-add-confirm" id="btn-add-confirm" onclick="confirmAdd()">추가</button>
  </div>
</div>

<!-- ───── 성경필사 홈 ───── -->
<div id="view-bible">
  <button class="back-to-main" onclick="goMain()">← 일상</button>
  <div class="bible-title">성경 필사</div>

  <div class="testament-block">
    <div class="testament-label">구약성경 (39권)</div>
    <div class="book-grid" id="ot-grid"></div>
  </div>

  <div class="testament-block">
    <div class="testament-label">신약성경 (27권)</div>
    <div class="book-grid" id="nt-grid"></div>
  </div>
</div>

<!-- ───── 책 상세 ───── -->
<div id="view-book">
  <div class="book-layout">
    <div class="sidebar">
      <div class="sidebar-top">
        <button class="back-btn" onclick="goBible()">← 성경 목록</button>
        <div class="sidebar-book-name" id="sidebar-title"></div>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
    </div>
    <div class="main-panel">
      <div id="state-empty">
        <div class="empty-text">아직 작성한 내용이 없습니다</div>
        <button class="btn-write-main" onclick="openEditor()">작성하기</button>
      </div>
      <div id="state-read">
        <div class="read-topbar">
          <div>
            <div class="read-ch-title" id="read-ch-title"></div>
            <div class="read-ch-date" id="read-ch-date"></div>
          </div>
          <div class="read-actions">
            <button class="btn-delete" onclick="deleteChapter()">삭제</button>
            <button class="btn-edit" onclick="openEditor(true)">수정</button>
            <button class="btn-write-sm" onclick="openEditor()">+ 새 장 작성</button>
          </div>
        </div>
        <div class="read-body" id="read-body"></div>
      </div>
      <div id="state-editor">
        <div class="editor-topbar">
          <input id="input-title" type="text" placeholder="1장" maxlength="20" />
          <div class="editor-btns">
            <button class="btn-cancel" onclick="cancelEdit()">취소</button>
            <button class="btn-save" onclick="saveChapter()">저장</button>
          </div>
        </div>
        <textarea id="input-content" placeholder="내용을 입력하세요..."></textarea>
      </div>
    </div>
  </div>
</div>

<script>
  const OT = ['창세기','출애굽기','레위기','민수기','신명기','여호수아','사사기','룻기',
    '사무엘상','사무엘하','열왕기상','열왕기하','역대상','역대하','에스라','느헤미야',
    '에스더','욥기','시편','잠언','전도서','아가','이사야','예레미야','예레미야애가',
    '에스겔','다니엘','호세아','요엘','아모스','오바댜','요나','미가','나훔','하박국',
    '스바냐','학개','스가랴','말라기'];
  const NT = ['마태복음','마가복음','누가복음','요한복음','사도행전','로마서','고린도전서',
    '고린도후서','갈라디아서','에베소서','빌립보서','골로새서','데살로니가전서',
    '데살로니가후서','디모데전서','디모데후서','디도서','빌레몬서','히브리서','야고보서',
    '베드로전서','베드로후서','요한일서','요한이서','요한삼서','유다서','요한계시록'];

  const BIBLE_KEY = 'bible_notes_v1';
  const MENU_KEY  = 'daily_menu_v1';

  let book = null, chapter = null, editMode = false;

  const bibleDB = {
    get: () => JSON.parse(localStorage.getItem(BIBLE_KEY) || '{}'),
    set: d  => localStorage.setItem(BIBLE_KEY, JSON.stringify(d))
  };
  const menuDB = {
    get: () => JSON.parse(localStorage.getItem(MENU_KEY) || 'null') || [{ id: 'bible', name: '성경필사' }],
    set: d  => localStorage.setItem(MENU_KEY, JSON.stringify(d))
  };

  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }

  /* ─── 뷰 전환 ─── */
  function showView(id) {
    ['view-main','view-bible','view-book'].forEach(v => {
      const el = document.getElementById(v);
      el.style.display = v === id ? (v === 'view-book' ? 'block' : 'flex') : 'none';
    });
  }

  /* ─── 메인(일상) ─── */
  function goMain() {
    showView('view-main');
    renderMenu();
  }

  function renderMenu() {
    const items = menuDB.get();
    const list  = document.getElementById('menu-list');
    list.innerHTML = '';
    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'menu-item';
      div.innerHTML = `<span class="menu-num">${i + 1}</span>
                       <span class="menu-name">${item.name}</span>
                       <span class="menu-arrow">›</span>`;
      div.onclick = () => openMenuItem(item);
      list.appendChild(div);
    });
  }

  function openMenuItem(item) {
    if (item.id === 'bible') {
      showView('view-bible');
      buildGrid(OT, 'ot-grid');
      buildGrid(NT, 'nt-grid');
    } else {
      alert(`"${item.name}" 준비 중입니다`);
    }
  }

  /* 항목 추가 */
  function toggleAddInput(forceClose = null) {
    const input   = document.getElementById('add-input');
    const btnOpen = document.getElementById('btn-add-open');
    const btnConf = document.getElementById('btn-add-confirm');
    const isOpen  = input.style.display === 'block';
    const open    = forceClose === false ? false : !isOpen;

    input.style.display   = open ? 'block' : 'none';
    btnConf.style.display = open ? 'block' : 'none';
    btnOpen.style.display = open ? 'none'  : 'flex';
    if (open) { input.value = ''; input.focus(); }
  }

  function confirmAdd() {
    const input = document.getElementById('add-input');
    const name  = input.value.trim();
    if (!name) return;
    const items = menuDB.get();
    items.push({ id: 'custom_' + Date.now(), name });
    menuDB.set(items);
    toggleAddInput(false);
    renderMenu();
  }

  /* ─── 성경필사 홈 ─── */
  function goBible() {
    showView('view-bible');
    buildGrid(OT, 'ot-grid');
    buildGrid(NT, 'nt-grid');
  }

  function buildGrid(books, id) {
    const data = bibleDB.get();
    const el   = document.getElementById(id);
    el.innerHTML = '';
    books.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'book-btn' + (data[b] ? ' written' : '');
      btn.textContent = b;
      btn.onclick = () => openBook(b);
      el.appendChild(btn);
    });
  }

  /* ─── 책 상세 ─── */
  function openBook(b) {
    book = b; chapter = null;
    showView('view-book');
    document.getElementById('sidebar-title').textContent = b;
    showState('empty');
    renderList();
  }

  function renderList() {
    const chapters = bibleDB.get()[book] || {};
    const list     = document.getElementById('chapter-list');
    const keys     = Object.keys(chapters);
    if (!keys.length) {
      list.innerHTML = '<div class="sidebar-empty">작성한 장이 여기에 나타납니다</div>';
      return;
    }
    list.innerHTML = '';
    keys.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'chapter-item' + (ch === chapter ? ' active' : '');
      div.innerHTML = `<div class="ch-name">${ch}</div><div class="ch-date">${fmtDate(chapters[ch].date)}</div>`;
      div.onclick = () => viewChapter(ch);
      list.appendChild(div);
    });
  }

  function showState(state) {
    document.getElementById('state-empty').style.display  = state === 'empty'  ? 'flex'  : 'none';
    document.getElementById('state-read').style.display   = state === 'read'   ? 'flex'  : 'none';
    document.getElementById('state-editor').style.display = state === 'editor' ? 'flex'  : 'none';
  }

  function viewChapter(ch) {
    const entry = bibleDB.get()[book][ch];
    chapter = ch;
    document.getElementById('read-ch-title').textContent = ch;
    document.getElementById('read-ch-date').textContent  = fmtDate(entry.date);
    document.getElementById('read-body').textContent     = entry.content;
    showState('read');
    renderList();
  }

  function openEditor(isEdit = false) {
    editMode = isEdit;
    if (isEdit && chapter) {
      const entry = bibleDB.get()[book][chapter];
      document.getElementById('input-title').value   = chapter;
      document.getElementById('input-content').value = entry.content;
    } else {
      document.getElementById('input-title').value   = '';
      document.getElementById('input-content').value = '';
    }
    showState('editor');
    document.getElementById('input-title').focus();
  }

  function cancelEdit() {
    chapter ? viewChapter(chapter) : showState('empty');
  }

  function deleteChapter() {
    if (!confirm(`"${chapter}"을 삭제할까요?`)) return;
    const data = bibleDB.get();
    delete data[book][chapter];
    if (!Object.keys(data[book]).length) delete data[book];
    bibleDB.set(data);
    chapter = null;
    renderList();
    showState('empty');
  }

  function saveChapter() {
    const title   = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();
    if (!title)   { alert('장 이름을 입력해주세요  예) 1장'); return; }
    if (!content) { alert('내용을 입력해주세요'); return; }

    const data = bibleDB.get();
    if (!data[book]) data[book] = {};

    let date = new Date().toISOString();
    if (editMode && chapter) {
      if (data[book][chapter]) date = data[book][chapter].date;
      if (chapter !== title) delete data[book][chapter];
    }
    data[book][title] = { date, content };
    bibleDB.set(data);

    chapter = title;
    renderList();
    viewChapter(title);
  }

  /* ─── 초기화 ─── */
  goMain();
</script>
</body>
</html>
