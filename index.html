<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일상</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f6fa;
      color: #222;
      height: 100vh;
      overflow: hidden;
    }

    /* ───────── 메인(일상) ───────── */
    #view-main {
      padding: 52px 60px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .main-title { font-size: 2em; font-weight: 800; color: #1a1a2e; letter-spacing: -0.02em; }
    .menu-list { display: flex; flex-direction: column; gap: 10px; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border: 1.5px solid #e4e8f5;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.13s;
      max-width: 480px;
    }
    .menu-item:hover { border-color: #2a4898; box-shadow: 0 2px 12px rgba(42,72,152,0.1); transform: translateX(3px); }
    .menu-num { font-size: 12px; font-weight: 700; color: #bbb; width: 20px; text-align: center; flex-shrink: 0; }
    .menu-name { font-size: 15px; font-weight: 600; color: #222; flex: 1; }
    .menu-arrow { color: #ccc; font-size: 16px; }
    .menu-item:hover .menu-arrow { color: #2a4898; }

    /* ───────── 공통 상단 ───────── */
    .view-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 32px 0;
      flex-shrink: 0;
    }
    .btn-back {
      font-size: 12px; color: #999; background: none; border: none;
      cursor: pointer; padding: 0; font-family: inherit; display: flex; align-items: center; gap: 4px;
    }
    .btn-back:hover { color: #2a4898; }
    .view-h-title { font-size: 1.3em; font-weight: 700; color: #1a3570; }

    /* ───────── 성경필사 ───────── */
    #view-bible {
      height: 100vh;
      display: none;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }
    .testament-block { display: flex; flex-direction: column; gap: 10px; padding: 0 32px; }
    .testament-label { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.12em; text-transform: uppercase; }
    .book-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .book-btn {
      padding: 8px 14px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: #2a4898; cursor: pointer; transition: all 0.13s;
      min-width: 66px; text-align: center;
    }
    .book-btn:hover { background: #2a4898; color: #fff; border-color: #2a4898; }
    .book-btn.written { background: #eef1ff; border-color: #a8b8ef; }

    /* ───────── 책 상세 ───────── */
    #view-book { display: none; height: 100vh; }
    .book-layout { display: flex; height: 100%; }
    .sidebar {
      width: 210px; min-width: 210px; background: #fff;
      border-right: 1px solid #e4e9f5; display: flex; flex-direction: column;
    }
    .sidebar-top { padding: 18px 16px 14px; border-bottom: 1px solid #e4e9f5; }
    .sidebar-book-name { font-size: 1.1em; font-weight: 700; color: #1a3570; }
    .chapter-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .chapter-item { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; }
    .chapter-item:hover { background: #f4f6ff; }
    .chapter-item.active { background: #eef1ff; border-left-color: #2a4898; }
    .ch-name { font-size: 13px; font-weight: 600; color: #2a4898; }
    .ch-date { font-size: 11px; color: #bbb; margin-top: 2px; }
    .sidebar-empty { padding: 20px 16px; font-size: 12px; color: #ccc; line-height: 1.7; text-align: center; }
    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #state-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .empty-text { font-size: 14px; color: #ccc; }
    .btn-write-main {
      padding: 13px 36px; background: #2a4898; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(42,72,152,0.22);
    }
    .btn-write-main:hover { background: #1a3570; }
    #state-read { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .read-topbar {
      padding: 24px 40px 18px; border-bottom: 1px solid #e4e9f5;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .read-ch-title { font-size: 1.5em; font-weight: 700; color: #1a3570; }
    .read-ch-date { font-size: 12px; color: #bbb; margin-top: 4px; }
    .read-actions { display: flex; gap: 8px; }
    .btn-delete { padding: 7px 16px; background: #fff; border: 1.5px solid #f0d0d0; border-radius: 7px; font-size: 13px; color: #c0392b; cursor: pointer; }
    .btn-delete:hover { background: #fff0f0; border-color: #c0392b; }
    .btn-edit { padding: 7px 16px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 7px; font-size: 13px; color: #555; cursor: pointer; }
    .btn-edit:hover { background: #f0f3ff; color: #2a4898; border-color: #a8b8ef; }
    .btn-write-sm { padding: 7px 16px; background: #2a4898; color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-write-sm:hover { background: #1a3570; }
    .read-body { flex: 1; overflow-y: auto; padding: 28px 40px 60px; font-size: 15px; line-height: 2.1; color: #333; white-space: pre-wrap; }
    #state-editor { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .editor-topbar { padding: 20px 40px 16px; border-bottom: 2px solid #e4e9f5; display: flex; align-items: center; gap: 12px; }
    #input-title { font-size: 1.5em; font-weight: 700; color: #1a3570; border: none; outline: none; background: transparent; width: 180px; font-family: inherit; }
    #input-title::placeholder { color: #ddd; font-weight: 400; }
    .editor-btns { margin-left: auto; display: flex; gap: 8px; }
    .btn-cancel { padding: 7px 14px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 7px; font-size: 13px; color: #777; cursor: pointer; }
    .btn-save { padding: 7px 22px; background: #2a4898; color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #1a3570; }
    #input-content { flex: 1; padding: 24px 40px 60px; border: none; outline: none; resize: none; font-size: 15px; line-height: 2.1; color: #333; background: transparent; font-family: inherit; }
    #input-content::placeholder { color: #ddd; }

    /* ───────── 일상 기록 ───────── */
    #view-daily {
      height: 100vh;
      display: none;
      flex-direction: column;
    }
    .daily-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid #e4e8f5;
      background: #fff;
    }
    .daily-left { display: flex; align-items: center; gap: 14px; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .btn-week {
      padding: 5px 12px; background: #fff; border: 1.5px solid #dce3f5;
      border-radius: 6px; font-size: 12px; color: #555; cursor: pointer; font-family: inherit;
    }
    .btn-week:hover { background: #f0f3ff; color: #2a4898; border-color: #a8b8ef; }
    .week-label { font-size: 13px; font-weight: 600; color: #444; min-width: 120px; text-align: center; }
    .daily-actions { display: flex; align-items: center; gap: 8px; }
    .btn-add-habit {
      padding: 6px 14px; background: #fff; border: 1.5px dashed #c0cae8;
      border-radius: 7px; font-size: 12px; color: #888; cursor: pointer; font-family: inherit;
    }
    .btn-add-habit:hover { border-color: #2a4898; color: #2a4898; }
    .btn-edit-mode {
      padding: 6px 14px; background: #fff; border: 1.5px solid #dce3f5;
      border-radius: 7px; font-size: 12px; color: #888; cursor: pointer; font-family: inherit;
    }
    .btn-edit-mode.active { background: #eef1ff; color: #2a4898; border-color: #a8b8ef; }

    /* 테이블 */
    .table-wrapper {
      flex: 1;
      overflow: auto;
      background: #fff;
    }
    .habit-table {
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 100%;
    }
    .habit-table th {
      background: #f4f6ff;
      font-size: 12px;
      font-weight: 700;
      color: #555;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid #dde3f5;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
    .habit-table th.col-habit {
      width: 155px;
      min-width: 155px;
      left: 0;
      z-index: 3;
      text-align: left;
      padding-left: 14px;
    }
    .habit-table th.today-col { background: #dce8ff; color: #2a4898; }
    .habit-table td {
      border: 1px solid #dde3f5;
      vertical-align: top;
      padding: 0;
      min-width: 110px;
    }
    .habit-table td.habit-name-cell {
      background: #fafbff;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      padding: 0;
      position: sticky;
      left: 0;
      z-index: 1;
      width: 155px;
      min-width: 155px;
    }
    .habit-name-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px 10px 14px;
      min-height: 52px;
      gap: 4px;
    }
    .habit-name-text { flex: 1; line-height: 1.4; outline: none; }
    .edit-mode .habit-name-text { border-bottom: 1px dashed #a8b8ef; cursor: text; }
    .btn-del-habit {
      display: none;
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .edit-mode .btn-del-habit { display: block; }
    /* 하루 메모 행 */
    .memo-row td { background: #f9fbff; }
    .memo-row td.habit-name-cell { background: #f0f4ff; }
    .memo-label {
      padding: 10px 10px 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #7b8fc7;
      letter-spacing: 0.03em;
    }
    .memo-cell-input {
      min-height: 80px;
      padding: 10px;
      font-size: 12px;
      color: #444;
      outline: none;
      line-height: 1.6;
      font-family: inherit;
      width: 100%;
      display: block;
      word-break: break-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .memo-cell-input:focus { background: #eef3ff; }
    .memo-cell-input:empty:before { content: attr(data-placeholder); color: #ccc; pointer-events: none; }
    .cell-check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px 5px;
      border-bottom: 1px solid #eef0f8;
      cursor: pointer;
    }
    .cell-checkbox {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: #2a4898;
      flex-shrink: 0;
    }
    .cell-check-label {
      font-size: 11px;
      color: #ccc;
      user-select: none;
    }
    .cell-check-label.done { color: #2a4898; font-weight: 700; }
    .cell-text {
      padding: 5px 10px 8px;
      font-size: 12px;
      color: #444;
      outline: none;
      min-height: 38px;
      line-height: 1.6;
      font-family: inherit;
      width: 100%;
      display: block;
    }
    .cell-text:focus { background: #f0f5ff; }
    .cell-text:empty:before { content: attr(data-placeholder); color: #ddd; pointer-events: none; }
    .habit-table tr:hover td { background: #fafcff; }
    .habit-table tr:hover td.habit-name-cell { background: #f4f6ff; }
    .habit-table td.today-col { background: #f8faff; }

    /* ───────── 재무관리 ───────── */
    #view-finance {
      height: 100vh;
      display: none;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 20px;
    }
    .finance-menu { padding: 0 48px; display: flex; flex-direction: column; gap: 10px; }

    /* ───────── 엑셀 ───────── */
    #view-excel { height: 100vh; display: none; flex-direction: column; }

    .excel-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #fff;
      border-bottom: 1px solid #dde3f0;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .xl-sep { width: 1px; height: 20px; background: #dde3f0; margin: 0 4px; flex-shrink: 0; }
    .xl-btn {
      padding: 4px 8px;
      background: none;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      min-width: 28px;
      font-family: inherit;
    }
    .xl-btn:hover { background: #f0f3ff; border-color: #c0cae8; }
    .xl-btn.active { background: #dce6ff; border-color: #a0b4e8; color: #2a4898; }
    .xl-btn.bold { font-weight: 700; }
    .xl-btn.italic { font-style: italic; }
    .xl-size-sel {
      padding: 3px 4px;
      border: 1px solid #dce3f5;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      color: #333;
      background: #fff;
      cursor: pointer;
      outline: none;
      width: 56px;
    }
    .xl-size-sel:focus { border-color: #2a4898; }

    .formula-bar {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 200px;
      margin-left: 4px;
    }
    .cell-addr {
      width: 56px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #444;
      border: 1px solid #dce3f5;
      border-radius: 4px 0 0 4px;
      padding: 4px 6px;
      background: #f8f9ff;
      flex-shrink: 0;
    }
    .fx-label {
      padding: 4px 7px;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #dce3f5;
      border-bottom: 1px solid #dce3f5;
      background: #f8f9ff;
      font-style: italic;
      flex-shrink: 0;
    }
    .formula-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #dce3f5;
      border-left: none;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    .formula-input:focus { border-color: #2a4898; }

    .sheet-body { flex: 1; overflow: hidden; }
    .grid-wrap { width: 100%; height: 100%; overflow: auto; position: relative; }

    .sheet-tbl { border-collapse: separate; border-spacing: 0; table-layout: fixed; }

    .sheet-tbl th {
      background: #f2f4fa;
      border-top: 1px solid #dde3f0;
      border-right: 1px solid #dde3f0;
      border-bottom: 1px solid #dde3f0;
      border-left: none;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-align: center;
      padding: 3px 4px;
      height: 24px;
      user-select: none;
      white-space: nowrap;
    }
    .sheet-tbl th.th-corner { border-left: 1px solid #dde3f0; }
    .sheet-tbl th.th-corner { position: sticky; top: 0; left: 0; z-index: 4; width: 42px; min-width: 42px; cursor: pointer; }
    .sheet-tbl th.th-corner.sel-all { background: #2a4898; color: #fff; }
    .sheet-tbl th.th-corner:hover { background: #e0e6f8; }
    .sheet-tbl th.th-col   { position: sticky; top: 0; z-index: 3; cursor: pointer; }
    .sheet-tbl th.th-col.sel-col { background: #c8d8f8; color: #1a3570; }
    .sheet-tbl th.th-col.sel-col-full { background: #2a4898; color: #fff; }
    .col-resizer { position: absolute; right: 0; top: 0; width: 5px; height: 100%; cursor: col-resize; z-index: 10; background: transparent; }
    .col-resizer:hover { background: rgba(42,72,152,0.35); }
    .row-resizer { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; cursor: row-resize; z-index: 10; background: transparent; }
    .row-resizer:hover { background: rgba(42,72,152,0.35); }
    .sheet-tbl td.td-rh { cursor: pointer; position: relative; }
    .sheet-tbl td.td-rh.sel-row-full { background: #2a4898; color: #fff; font-weight: 600; }
    .sheet-tbl td.sel-col-full { background: #c8d8f8; }
    .sheet-tbl td.sel-row-full { background: #c8d8f8; }

    .sheet-tbl td {
      border-top: none;
      border-left: none;
      border-right: 1px solid #e4e8f5;
      border-bottom: 1px solid #e4e8f5;
      padding: 0;
      height: 24px;
      overflow: hidden;
      cursor: cell;
      vertical-align: middle;
    }
    .sheet-tbl td.td-rh {
      background: #f2f4fa;
      text-align: center;
      font-size: 11px;
      color: #888;
      border-top: none;
      border-left: 1px solid #dde3f0;
      border-right: 1px solid #dde3f0;
      border-bottom: 1px solid #dde3f0;
      position: sticky;
      left: 0;
      z-index: 1;
      cursor: default;
      width: 42px;
      min-width: 42px;
      padding: 0 4px;
    }
    .sheet-tbl td.td-rh.sel-row { background: #c8d8f8; color: #1a3570; font-weight: 600; }
    .sheet-tbl td.sel {
      outline: 2px solid #2a4898;
      outline-offset: -2px;
      background: #eef3ff;
    }
    .sheet-tbl td.in-range { background: #dce8fd !important; }
    .sheet-tbl { user-select: none; }
    .sheet-tbl td.cut-cell { outline: 2px dashed #2a4898; outline-offset: -2px; animation: dash-anim 0.6s linear infinite; }
    @keyframes dash-anim { to { outline-offset: 4px; opacity: 0.5; } }
    .xl-border-wrap { position: relative; display: inline-flex; align-items: center; }
    .xl-border-drop { position: absolute; top: 100%; left: 0; z-index: 999; background: #fff; border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); padding: 4px 0; min-width: 160px; display: none; }
    .xl-border-drop.open { display: block; }
    .xl-border-drop button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 14px; background: none; border: none; cursor: pointer; font-size: 13px; text-align: left; white-space: nowrap; }
    .xl-border-drop button:hover { background: #f0f4ff; }
    .xl-border-drop button .bd-icon { width: 20px; height: 20px; flex-shrink: 0; }
    @media (prefers-color-scheme: dark) {
      .xl-border-drop { background: #2a2a2a; border-color: #444; color: #eee; }
      .xl-border-drop button:hover { background: #3a3a4a; }
    }

    .cell-val {
      display: block;
      padding: 2px 5px;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      line-height: 20px;
    }
    .cell-edit-input {
      width: 100%;
      height: 100%;
      border: none;
      outline: 2px solid #2a4898;
      outline-offset: -1px;
      padding: 2px 5px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      display: block;
      box-sizing: border-box;
    }

    .sheet-footer {
      display: flex;
      align-items: center;
      background: #edf0f8;
      border-top: 1px solid #dde3f0;
      padding: 0 8px;
      height: 26px;
      flex-shrink: 0;
      gap: 4px;
    }
    .sheet-tab {
      padding: 3px 14px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #777;
      background: transparent;
    }
    .sheet-tab.active {
      background: #fff;
      border-color: #dde3f0;
      color: #2a4898;
      font-weight: 600;
    }
    .sheet-tab { display: flex; align-items: center; gap: 3px; }
    .tab-del {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 5px;
      width: 14px;
      height: 14px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
      border-radius: 3px;
      vertical-align: middle;
    }
    .tab-del:hover { background: #f0c0c0; color: #e74c3c; }
    .tab-add {
      padding: 3px 10px;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      background: none;
      border: none;
      border-radius: 4px;
    }
    .tab-add:hover { background: #dde3f0; color: #2a4898; }
    .xl-color-wrap { display: inline-flex; align-items: center; gap: 2px; }
    .xl-color-btn { display: inline-flex; align-items: center; gap: 4px; }
    .color-swatch { display: inline-block; width: 18px; height: 10px; border: 1px solid #aaa; border-radius: 2px; }
    .xl-clear-color { font-size: 10px; padding: 2px 4px; color: #888; }
    input[type="color"].xl-hidden-picker { width: 0; height: 0; padding: 0; border: none; visibility: hidden; position: absolute; }
    .tab-name-input {
      width: 70px;
      font-family: inherit;
      font-size: 12px;
      border: 1px solid #2a4898;
      border-radius: 3px;
      outline: none;
      padding: 1px 4px;
      background: #fff;
    }
  </style>
</head>
<body>

<!-- ───── 일상 메인 ───── -->
<div id="view-main">
  <div class="main-title">일상</div>
  <div class="menu-list">
    <div class="menu-item" onclick="openBible()">
      <span class="menu-num">1</span>
      <span class="menu-name">성경필사</span>
      <span class="menu-arrow">›</span>

      <span class="menu-num">2</span>
      <span class="menu-name">일상</span>

    </div>
    <div class="menu-item" onclick="openFinance()">
      <span class="menu-num">3</span>
      <span class="menu-name">재무관리</span>
      <span class="menu-arrow">›</span>

</div>

<!-- ───── 재무관리 ───── -->
<div id="view-finance">
  <div class="view-header">
    <button class="btn-back" onclick="goMain()">← 일상</button>
    <div class="view-h-title">재무관리</div>
  </div>
  <div class="finance-menu">
    <div class="menu-item" onclick="openExcel()">
      <span class="menu-num">1</span>
      <span class="menu-name">엑셀</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

<!-- ───── 엑셀 ───── -->
<div id="view-excel">
  <div class="excel-toolbar">
    <button class="btn-back xl-btn" onclick="openFinance()" style="margin-right:4px">← 재무관리</button>
    <div class="xl-sep"></div>
    <button class="xl-btn bold" id="xl-bold" onclick="xlFormat('b')" title="굵게 (Ctrl+B)">B</button>
    <button class="xl-btn italic" id="xl-italic" onclick="xlFormat('i')" title="기울임 (Ctrl+I)">I</button>
    <div class="xl-sep"></div>
    <button class="xl-btn" id="xl-left"   onclick="xlAlign('left')"   title="왼쪽 정렬">좌</button>
    <button class="xl-btn" id="xl-center" onclick="xlAlign('center')" title="가운데 정렬">중</button>
    <button class="xl-btn" id="xl-right"  onclick="xlAlign('right')"  title="오른쪽 정렬">우</button>
    <div class="xl-sep"></div>
    <select class="xl-size-sel" id="xl-size" onchange="xlSetSize(this.value)" title="글씨 크기">
      <option value="">크기</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="32">32</option>
    </select>
    <div class="xl-sep"></div>
    <button class="xl-btn" onclick="xlAddRow()"  title="행 추가">+ 행</button>
    <button class="xl-btn" onclick="xlAddCol()"  title="열 추가">+ 열</button>
    <div class="xl-sep"></div>
    <button class="xl-btn" id="xl-merge" onclick="xlMerge()" title="셀 병합 / 해제">병합</button>
    <div class="xl-sep"></div>
    <div class="xl-border-wrap">
      <button class="xl-btn" onclick="toggleBorderDrop()" title="테두리">테두리 ▾</button>
      <div class="xl-border-drop" id="xl-border-drop">
        <button onclick="xlSetBorder('all');closeBorderDrop()">
          <svg class="bd-icon" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#333" stroke-width="1.5"/><line x1="2" y1="10" x2="18" y2="10" stroke="#333" stroke-width="1"/><line x1="10" y1="2" x2="10" y2="18" stroke="#333" stroke-width="1"/></svg>모든 테두리
        </button>
        <button onclick="xlSetBorder('outer');closeBorderDrop()">
          <svg class="bd-icon" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#333" stroke-width="1.5"/></svg>바깥 테두리
        </button>
        <button onclick="xlSetBorder('thick-outer');closeBorderDrop()">
          <svg class="bd-icon" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#333" stroke-width="3"/></svg>두꺼운 바깥 테두리
        </button>
        <button onclick="xlSetBorder('none');closeBorderDrop()">
          <svg class="bd-icon" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/></svg>테두리 없음
        </button>
      </div>
    </div>
    <div class="xl-sep"></div>
    <div class="xl-color-wrap" title="셀 배경색">
      <button class="xl-btn xl-color-btn" onclick="document.getElementById('xl-bg-picker').click()" title="배경색 선택">
        <span class="color-swatch" id="xl-bg-swatch"></span>배경색
      </button>
      <input type="color" class="xl-hidden-picker" id="xl-bg-picker" value="#ffff88" onchange="xlSetBg(this.value)">
      <button class="xl-btn xl-clear-color" onclick="xlSetBg('')" title="배경색 제거">✕</button>
    </div>
    <div class="xl-color-wrap" title="글씨 색">
      <button class="xl-btn xl-color-btn" onclick="document.getElementById('xl-tc-picker').click()" title="글씨 색 선택">
        <span class="color-swatch" id="xl-tc-swatch" style="background:#e74c3c"></span>글씨색
      </button>
      <input type="color" class="xl-hidden-picker" id="xl-tc-picker" value="#e74c3c" onchange="xlSetTc(this.value)">
      <button class="xl-btn xl-clear-color" onclick="xlSetTc('')" title="글씨 색 제거">✕</button>
    </div>
    <div class="xl-sep"></div>
    <div class="formula-bar">
      <div class="cell-addr" id="xl-addr">A1</div>
      <div class="fx-label">fx</div>
      <input class="formula-input" id="xl-formula" placeholder="값 또는 수식  예) =SUM(A1:A5)" />
    </div>
  </div>
  <div class="sheet-body">
    <div class="grid-wrap" id="xl-grid"></div>
  </div>
  <div class="sheet-footer" id="xl-tabs"></div>
</div>

<!-- ───── 성경필사 ───── -->
<div id="view-bible">
  <div class="view-header">
    <button class="btn-back" onclick="goMain()">← 일상</button>
    <div class="view-h-title">성경필사</div>
  </div>
  <div class="testament-block">
    <div class="testament-label">구약성경 (39권)</div>
    <div class="book-grid" id="ot-grid"></div>
  </div>
  <div class="testament-block">
    <div class="testament-label">신약성경 (27권)</div>
    <div class="book-grid" id="nt-grid"></div>
  </div>
</div>

<!-- ───── 책 상세 ───── -->
<div id="view-book">
  <div class="book-layout">
    <div class="sidebar">
      <div class="sidebar-top">
        <button class="btn-back" style="margin-bottom:10px" onclick="openBible()">← 성경 목록</button>
        <div class="sidebar-book-name" id="sidebar-title"></div>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
    </div>
    <div class="main-panel">
      <div id="state-empty">
        <div class="empty-text">아직 작성한 내용이 없습니다</div>
        <button class="btn-write-main" onclick="openEditor()">작성하기</button>
      </div>
      <div id="state-read">
        <div class="read-topbar">
          <div>
            <div class="read-ch-title" id="read-ch-title"></div>
            <div class="read-ch-date" id="read-ch-date"></div>
          </div>
          <div class="read-actions">
            <button class="btn-delete" onclick="deleteChapter()">삭제</button>
            <button class="btn-edit" onclick="openEditor(true)">수정</button>
            <button class="btn-write-sm" onclick="openEditor()">+ 새 장 작성</button>
          </div>
        </div>
        <div class="read-body" id="read-body"></div>
      </div>
      <div id="state-editor">
        <div class="editor-topbar">
          <input id="input-title" type="text" placeholder="1장" maxlength="20" />
          <div class="editor-btns">
            <button class="btn-cancel" onclick="cancelEdit()">취소</button>
            <button class="btn-save" onclick="saveChapter()">저장</button>
          </div>
        </div>
        <textarea id="input-content" placeholder="내용을 입력하세요..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- ───── 일상 기록 ───── -->
<div id="view-daily">
  <div class="daily-topbar">
    <div class="daily-left">
      <button class="btn-back" onclick="goMain()">← 일상</button>
      <div class="view-h-title">일상 기록</div>
    </div>
    <div class="week-nav">
      <button class="btn-week" onclick="moveWeek(-1)">‹ 이전</button>
      <div class="week-label" id="week-label"></div>
      <button class="btn-week" onclick="moveWeek(1)">다음 ›</button>
    </div>
    <div class="daily-actions">
      <button class="btn-edit-mode" id="btn-edit-mode" onclick="toggleEditMode()">편집</button>
      <button class="btn-add-habit" onclick="addHabit()">+ 항목 추가</button>
    </div>
  </div>
  <div class="table-wrapper" id="table-wrapper"></div>
</div>

<script>
  /* ════════ 공통 ════════ */
  const OT = ['창세기','출애굽기','레위기','민수기','신명기','여호수아','사사기','룻기',
    '사무엘상','사무엘하','열왕기상','열왕기하','역대상','역대하','에스라','느헤미야',
    '에스더','욥기','시편','잠언','전도서','아가','이사야','예레미야','예레미야애가',
    '에스겔','다니엘','호세아','요엘','아모스','오바댜','요나','미가','나훔','하박국',
    '스바냐','학개','스가랴','말라기'];
  const NT = ['마태복음','마가복음','누가복음','요한복음','사도행전','로마서','고린도전서',
    '고린도후서','갈라디아서','에베소서','빌립보서','골로새서','데살로니가전서',
    '데살로니가후서','디모데전서','디모데후서','디도서','빌레몬서','히브리서','야고보서',
    '베드로전서','베드로후서','요한일서','요한이서','요한삼서','유다서','요한계시록'];

  const DAY_KO = ['일','월','화','수','목','금','토'];

  function showView(id) {
    ['view-main','view-bible','view-book','view-daily','view-finance','view-excel'].forEach(v => {
      const el = document.getElementById(v);
      el.style.display = (v === id) ? 'flex' : 'none';
      if (v === 'view-book' && v === id) el.style.display = 'block';
    });
  }

  function goMain() { showView('view-main'); }

  /* ════════ 성경필사 ════════ */
  const BIBLE_KEY = 'bible_notes_v1';
  const bibleDB = {
    get: () => JSON.parse(localStorage.getItem(BIBLE_KEY) || '{}'),
    set: d  => localStorage.setItem(BIBLE_KEY, JSON.stringify(d))
  };
  let book = null, chapter = null, editMode = false;

  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }

  function openBible() {
    showView('view-bible');
    buildGrid(OT, 'ot-grid');
    buildGrid(NT, 'nt-grid');
  }

  function buildGrid(books, id) {
    const data = bibleDB.get();
    const el = document.getElementById(id);
    el.innerHTML = '';
    books.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'book-btn' + (data[b] ? ' written' : '');
      btn.textContent = b;
      btn.onclick = () => openBook(b);
      el.appendChild(btn);
    });
  }

  function openBook(b) {
    book = b; chapter = null;
    document.getElementById('view-book').style.display = 'block';
    ['view-main','view-bible','view-daily'].forEach(v => document.getElementById(v).style.display = 'none');
    document.getElementById('sidebar-title').textContent = b;
    showState('empty');
    renderList();
  }

  function renderList() {
    const chapters = bibleDB.get()[book] || {};
    const list = document.getElementById('chapter-list');
    const keys = Object.keys(chapters);
    if (!keys.length) { list.innerHTML = '<div class="sidebar-empty">작성한 장이 여기에 나타납니다</div>'; return; }
    list.innerHTML = '';
    keys.slice().reverse().forEach(ch => {
      const div = document.createElement('div');
      div.className = 'chapter-item' + (ch === chapter ? ' active' : '');
      div.innerHTML = `<div class="ch-name">${ch}</div><div class="ch-date">${fmtDate(chapters[ch].date)}</div>`;
      div.onclick = () => viewChapter(ch);
      list.appendChild(div);
    });
  }

  function showState(state) {
    document.getElementById('state-empty').style.display  = state === 'empty'  ? 'flex'  : 'none';
    document.getElementById('state-read').style.display   = state === 'read'   ? 'flex'  : 'none';
    document.getElementById('state-editor').style.display = state === 'editor' ? 'flex'  : 'none';
  }

  function viewChapter(ch) {
    const entry = bibleDB.get()[book][ch];
    chapter = ch;
    document.getElementById('read-ch-title').textContent = ch;
    document.getElementById('read-ch-date').textContent  = fmtDate(entry.date);
    document.getElementById('read-body').textContent     = entry.content;
    showState('read');
    renderList();
  }

  function openEditor(isEdit = false) {
    editMode = isEdit;
    if (isEdit && chapter) {
      const entry = bibleDB.get()[book][chapter];
      document.getElementById('input-title').value   = chapter;
      document.getElementById('input-content').value = entry.content;
    } else {
      document.getElementById('input-title').value   = '';
      document.getElementById('input-content').value = '';
    }
    showState('editor');
    document.getElementById('input-title').focus();
  }

  function cancelEdit() { chapter ? viewChapter(chapter) : showState('empty'); }

  function deleteChapter() {
    if (!confirm(`"${chapter}"을 삭제할까요?`)) return;
    const data = bibleDB.get();
    delete data[book][chapter];
    if (!Object.keys(data[book]).length) delete data[book];
    bibleDB.set(data);
    chapter = null;
    renderList();
    showState('empty');
  }

  function saveChapter() {
    const title   = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();
    if (!title)   { alert('장 이름을 입력해주세요  예) 1장'); return; }
    if (!content) { alert('내용을 입력해주세요'); return; }
    const data = bibleDB.get();
    if (!data[book]) data[book] = {};
    let date = new Date().toISOString();
    if (editMode && chapter) {
      if (data[book][chapter]) date = data[book][chapter].date;
      if (chapter !== title) delete data[book][chapter];
    }
    data[book][title] = { date, content };
    bibleDB.set(data);
    chapter = title;
    renderList();
    viewChapter(title);
  }

  /* ════════ 일상 기록 ════════ */
  const DAILY_KEY = 'daily_habits_v1';
  const DEFAULT_HABITS = [];

  const dailyDB = {
    get: () => {
      const d = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null')
             || { habits: [...DEFAULT_HABITS], records: {}, memos: {} };
      if (!d.memos) d.memos = {};
      return d;
    },
    set: d => localStorage.setItem(DAILY_KEY, JSON.stringify(d))
  };

  let weekOffset  = 0;
  let dailyEditMode = false;

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getWeekDays(offset) {
    const now  = new Date();
    const day  = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1) + offset * 7;
    const mon  = new Date(now);
    mon.setDate(diff);
    mon.setHours(0,0,0,0);
    return Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  }

  function isToday(d) {
    const t = new Date();
    return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
  }

  function openDaily() {
    showView('view-daily');
    weekOffset = 0;
    dailyEditMode = false;
    document.getElementById('btn-edit-mode').classList.remove('active');
    renderDaily();
  }

  function moveWeek(dir) { weekOffset += dir; renderDaily(); }

  function toggleEditMode() {
    dailyEditMode = !dailyEditMode;
    const btn = document.getElementById('btn-edit-mode');
    btn.classList.toggle('active', dailyEditMode);
    btn.textContent = dailyEditMode ? '완료' : '편집';
    renderDaily();
  }

  function addHabit() {
    const name = prompt('추가할 항목 이름을 입력하세요');
    if (!name || !name.trim()) return;
    const data = dailyDB.get();
    data.habits.push(name.trim());
    dailyDB.set(data);
    renderDaily();
  }

  function deleteHabit(habit) {
    if (!confirm(`"${habit}" 항목을 삭제할까요?`)) return;
    const data = dailyDB.get();
    data.habits = data.habits.filter(h => h !== habit);
    Object.values(data.records).forEach(rec => delete rec[habit]);
    dailyDB.set(data);
    renderDaily();
  }

  function renameHabit(oldName, newName) {
    newName = newName.trim();
    if (!newName || newName === oldName) return;
    const data = dailyDB.get();
    const idx = data.habits.indexOf(oldName);
    if (idx > -1) data.habits[idx] = newName;
    Object.keys(data.records).forEach(date => {
      if (data.records[date][oldName] !== undefined) {
        data.records[date][newName] = data.records[date][oldName];
        delete data.records[date][oldName];
      }
    });
    dailyDB.set(data);
    renderDaily();
  }

  function renderDaily() {
    const data = dailyDB.get();
    const days = getWeekDays(weekOffset);
    const wrapper = document.getElementById('table-wrapper');

    // 주 레이블
    const first = days[0], last = days[6];
    document.getElementById('week-label').textContent =
      `${first.getMonth()+1}/${first.getDate()} - ${last.getMonth()+1}/${last.getDate()}`;

    wrapper.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'habit-table' + (dailyEditMode ? ' edit-mode' : '');

    /* 헤더 */
    const thead = table.createTHead();
    const hRow  = thead.insertRow();
    const thH   = document.createElement('th');
    thH.textContent = '항목';
    thH.className   = 'col-habit';
    hRow.appendChild(thH);
    days.forEach(d => {
      const th = document.createElement('th');
      th.textContent = `${d.getMonth()+1}/${d.getDate()} ${DAY_KO[d.getDay()]}`;
      th.style.width    = '130px';
      th.style.minWidth = '130px';
      th.style.maxWidth = '130px';
      if (isToday(d)) th.classList.add('today-col');
      hRow.appendChild(th);
    });

    /* 하루 메모 행 */
    const tbody = table.createTBody();
    const memoRow = tbody.insertRow();
    memoRow.className = 'memo-row';
    const memoLabel = memoRow.insertCell();
    memoLabel.className = 'habit-name-cell';
    memoLabel.innerHTML = '<div class="memo-label">하루 메모</div>';
    days.forEach(d => {
      const key = dateKey(d);
      const memoVal = data.memos[key] || '';
      const td = memoRow.insertCell();
      if (isToday(d)) td.classList.add('today-col');
      const div = document.createElement('div');
      div.className = 'memo-cell-input';
      div.contentEditable = 'true';
      div.dataset.placeholder = '하루를 정리해보세요...';
      if (memoVal) div.innerHTML = memoVal.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      div.addEventListener('blur', () => {
        const d2 = dailyDB.get();
        const v = div.innerText.trim();
        if (v) d2.memos[key] = v;
        else   delete d2.memos[key];
        dailyDB.set(d2);
      });
      td.appendChild(div);
    });

    /* 습관 행 */
    data.habits.forEach(habit => {
      const row = tbody.insertRow();

      // 항목명 셀
      const tdName = row.insertCell();
      tdName.className = 'habit-name-cell';
      const inner = document.createElement('div');
      inner.className = 'habit-name-inner';
      const nameText = document.createElement('span');
      nameText.className = 'habit-name-text';
      nameText.textContent = habit;
      if (dailyEditMode) {
        nameText.contentEditable = 'true';
        nameText.addEventListener('blur', () => renameHabit(habit, nameText.textContent));
        nameText.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameText.blur(); } });
      }
      inner.appendChild(nameText);
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del-habit';
      delBtn.textContent = '×';
      delBtn.onclick = () => deleteHabit(habit);
      inner.appendChild(delBtn);
      tdName.appendChild(inner);

      // 날짜별 셀
      days.forEach(d => {
        const key   = dateKey(d);
        const saved = data.records[key]?.[habit] || {};
        const checked = saved.checked || false;
        const text    = saved.text    || '';

        const td = row.insertCell();
        if (isToday(d)) td.classList.add('today-col');

        // 체크 행
        const checkRow = document.createElement('div');
        checkRow.className = 'cell-check-row';

        const chk = document.createElement('input');
        chk.type      = 'checkbox';
        chk.className = 'cell-checkbox';
        chk.checked   = checked;

        const lbl = document.createElement('span');
        lbl.className = 'cell-check-label' + (checked ? ' done' : '');
        lbl.textContent = checked ? '완료' : '미완료';

        const save = () => {
          const d2 = dailyDB.get();
          if (!d2.records[key]) d2.records[key] = {};
          const t = textDiv.textContent.trim();
          if (!chk.checked && !t) delete d2.records[key][habit];
          else d2.records[key][habit] = { checked: chk.checked, text: t };
          dailyDB.set(d2);
        };

        chk.addEventListener('change', () => {
          lbl.textContent = chk.checked ? '완료' : '미완료';
          lbl.className   = 'cell-check-label' + (chk.checked ? ' done' : '');
          save();
        });
        checkRow.addEventListener('click', e => {
          if (e.target !== chk) { chk.checked = !chk.checked; chk.dispatchEvent(new Event('change')); }
        });

        checkRow.appendChild(chk);
        checkRow.appendChild(lbl);

        // 텍스트 입력
        const textDiv = document.createElement('div');
        textDiv.className       = 'cell-text';
        textDiv.contentEditable = 'true';
        textDiv.dataset.placeholder = '메모...';
        textDiv.textContent     = text;
        textDiv.addEventListener('blur', save);
        textDiv.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textDiv.blur(); } });

        td.appendChild(checkRow);
        td.appendChild(textDiv);
      });
    });

    wrapper.appendChild(table);
  }

  /* ════════ 재무관리 ════════ */
  function openFinance() { showView('view-finance'); }

  /* ════════ 엑셀 ════════ */
  const XL_KEY = 'xl_data_v1';
  const XL_DEFAULT_ROWS = 50;
  const XL_DEFAULT_COLS = 15;

  function xlNewSheet(name) {
    return { name, data: {}, rows: XL_DEFAULT_ROWS, cols: XL_DEFAULT_COLS, colW: {}, rowH: {}, merges: [] };
  }

  const xlDB = {
    get: () => {
      let d = JSON.parse(localStorage.getItem(XL_KEY) || 'null');
      if (!d) return { sheets: [xlNewSheet('Sheet 1')], active: 0 };
      // 구버전 마이그레이션
      if (!d.sheets) d = { sheets: [{ name: 'Sheet 1', data: d.data||{}, rows: d.rows||XL_DEFAULT_ROWS, cols: d.cols||XL_DEFAULT_COLS, colW: d.colW||{}, rowH: {}, merges: [] }], active: 0 };
      d.sheets.forEach(s => { if (!s.merges) s.merges = []; });
      return d;
    },
    set: d => localStorage.setItem(XL_KEY, JSON.stringify(d)),
    sh:  function() { const d = this.get(); return { db: d, sh: d.sheets[d.active] }; }
  };

  let xlSel = 'A1';
  let xlEditing = false;
  let xlSelCol = null;
  let xlSelRow = null;
  let xlSelAll = false;
  let xlRangeStart = null; // 범위 선택 시작
  let xlRangeEnd   = null; // 범위 선택 끝
  let xlClipboard  = null; // { cells:[{dr,dc,data}], rowCount, colCount, type, origRefs }
  let xlIsDragging = false;

  /* ─ 열 이름 변환 ─ */
  function colLetter(n) { // n: 0-indexed → 'A','B',...
    let s = '', x = n + 1;
    while (x > 0) { x--; s = String.fromCharCode(65 + x % 26) + s; x = Math.floor(x / 26); }
    return s;
  }
  function colIdx(letter) { // 'A'→0, 'B'→1
    let n = 0;
    for (let i = 0; i < letter.length; i++) n = n * 26 + letter.charCodeAt(i) - 64;
    return n - 1;
  }
  function parseRef(ref) {
    const m = ref.toUpperCase().match(/^([A-Z]+)(\d+)$/);
    if (!m) return null;
    return { col: m[1], row: parseInt(m[2]), ci: colIdx(m[1]), ri: parseInt(m[2]) - 1 };
  }
  function xlRangeBounds() {
    const s = parseRef(xlRangeStart || xlSel);
    const e = parseRef(xlRangeEnd   || xlSel);
    if (!s || !e) return null;
    return { rMin: Math.min(s.ri,e.ri), rMax: Math.max(s.ri,e.ri),
             cMin: Math.min(s.ci,e.ci), cMax: Math.max(s.ci,e.ci) };
  }
  function xlHasRange() { return xlRangeStart && xlRangeEnd && xlRangeStart !== xlRangeEnd; }

  // 병합 헬퍼
  function xlMergeAt(merges, r, c) { return merges.find(m => m.r1===r && m.c1===c); }
  function xlMergeCovering(merges, r, c) { return merges.find(m => r>=m.r1 && r<=m.r2 && c>=m.c1 && c<=m.c2); }
  function xlCoveredSet(merges) {
    const s = new Set();
    merges.forEach(m => {
      for (let r=m.r1; r<=m.r2; r++)
        for (let c=m.c1; c<=m.c2; c++)
          if (r!==m.r1 || c!==m.c1) s.add(colLetter(c)+(r+1));
    });
    return s;
  }

  function rangeCells(from, to) {
    const f = parseRef(from), t = parseRef(to);
    if (!f || !t) return [];
    const out = [];
    for (let r = Math.min(f.row,t.row); r <= Math.max(f.row,t.row); r++)
      for (let c = Math.min(f.ci,t.ci); c <= Math.max(f.ci,t.ci); c++)
        out.push(colLetter(c) + r);
    return out;
  }

  /* ─ 수식 계산 ─ */
  function xlCellVal(ref, data, seen = new Set()) {
    ref = ref.toUpperCase();
    if (seen.has(ref)) return '#순환!';
    seen.add(ref);
    const cell = data[ref];
    if (!cell || (cell.v === '' && !cell.f)) return '';
    if (cell.f) return xlEval(cell.f, data, seen);
    const n = parseFloat(cell.v);
    return (!isNaN(n) && String(n) === cell.v.trim()) ? n : cell.v;
  }

  function xlEval(formula, data, seen = new Set()) {
    if (!formula.startsWith('=')) return formula;
    let e = formula.slice(1).trim().toUpperCase();

    const FN = {
      SUM:     vs => vs.reduce((a,b)=>a+(+b||0), 0),
      AVERAGE: vs => { const ns=vs.map(Number).filter(n=>!isNaN(n)); return ns.length?ns.reduce((a,b)=>a+b)/ns.length:0; },
      AVG:     vs => { const ns=vs.map(Number).filter(n=>!isNaN(n)); return ns.length?ns.reduce((a,b)=>a+b)/ns.length:0; },
      MIN:     vs => { const ns=vs.map(Number).filter(n=>!isNaN(n)); return ns.length?Math.min(...ns):0; },
      MAX:     vs => { const ns=vs.map(Number).filter(n=>!isNaN(n)); return ns.length?Math.max(...ns):0; },
      COUNT:   vs => vs.filter(v=>v!==''&&!isNaN(+v)).length,
      COUNTA:  vs => vs.filter(v=>v!=='').length,
      ABS:     vs => Math.abs(+vs[0]||0),
      ROUND:   vs => +( (+vs[0]||0).toFixed(+vs[1]||0) ),
      SQRT:    vs => Math.sqrt(+vs[0]||0),
      INT:     vs => Math.floor(+vs[0]||0),
    };

    // Expand ranges in function args, then apply function
    e = e.replace(new RegExp('\\b(' + Object.keys(FN).join('|') + ')\\(([^)]+)\\)', 'g'), (_, fn, args) => {
      const vals = args.split(',').flatMap(a => {
        a = a.trim();
        const rm = a.match(/^([A-Z]+\d+):([A-Z]+\d+)$/);
        if (rm) return rangeCells(rm[1], rm[2]).map(r => { const v = xlCellVal(r, data, new Set(seen)); return v===''?'0':isNaN(+v)?'0':+v; });
        const cm = a.match(/^([A-Z]+\d+)$/);
        if (cm) { const v = xlCellVal(a, data, new Set(seen)); return [v===''?0:isNaN(+v)?0:+v]; }
        return [isNaN(+a)?0:+a];
      });
      const result = FN[fn] ? FN[fn](vals) : 0;
      return isNaN(result)||!isFinite(result) ? 0 : result;
    });

    // IF(cond, t, f)
    e = e.replace(/IF\(([^,]+),([^,]+),([^)]+)\)/g, (_, cond, tv, fv) => {
      try { return Function('"use strict";return (' + cond + ')')() ? tv.trim() : fv.trim(); }
      catch { return fv.trim(); }
    });

    // Replace remaining cell refs
    e = e.replace(/[A-Z]+\d+/g, ref => {
      const v = xlCellVal(ref, data, new Set(seen));
      if (v === '' || v == null) return '0';
      return isNaN(+v) ? `"${String(v).replace(/"/g,'\\"')}"` : +v;
    });

    try {
      const r = Function('"use strict";return (' + e + ')')();
      if (typeof r === 'number') { if (!isFinite(r)) return '#DIV/0!'; return +r.toPrecision(10).replace(/\.?0+$/,''); }
      return r;
    } catch { return '#오류!'; }
  }

  function xlDisplay(ref, data) {
    const v = xlCellVal(ref, data);
    if (v === '' || v == null) return '';
    if (typeof v === 'number') return +v.toPrecision(10).replace(/\.?0+$/,'');
    return v;
  }

  /* ─ 렌더링 ─ */
  function xlRender() {
    const db = xlDB.get();
    const sh = db.sheets[db.active];
    const { data, rows, cols, colW, rowH = {} } = sh;
    const merges = sh.merges || [];
    const covered = xlCoveredSet(merges);
    const sel = parseRef(xlSel);
    const wrap = document.getElementById('xl-grid');
    wrap.innerHTML = '';

    const tbl = document.createElement('table');
    tbl.className = 'sheet-tbl';

    const thead = tbl.createTHead();
    const hr = thead.insertRow();
    const corner = document.createElement('th');
    corner.className = 'th-corner' + (xlSelAll ? ' sel-all' : '');
    corner.title = '전체 선택';
    corner.addEventListener('click', () => { if (xlEditing) xlCommit(); xlSelectAll(); });
    hr.appendChild(corner);
    for (let c = 0; c < cols; c++) {
      const th = document.createElement('th');
      th.className = 'th-col' + ((xlSelAll || xlSelCol === c) ? ' sel-col-full' : (xlSelCol === null && !xlSelAll && sel && sel.ci === c ? ' sel-col' : ''));
      th.textContent = colLetter(c);
      const w = colW[colLetter(c)] || 100;
      th.style.width = th.style.minWidth = w + 'px';
      th.addEventListener('click', ((ci) => () => { if (xlEditing) xlCommit(); xlSelectCol(ci); })(c));
      const colResizer = document.createElement('div');
      colResizer.className = 'col-resizer';
      colResizer.addEventListener('click', e => e.stopPropagation());
      colResizer.addEventListener('mousedown', ((th_, letter_) => e => {
        e.stopPropagation(); e.preventDefault();
        const startX = e.clientX, startW = colW[letter_] || 100;
        const onMove = e2 => { th_.style.width = th_.style.minWidth = Math.max(30, startW + e2.clientX - startX) + 'px'; };
        const onUp = e2 => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          const db2 = xlDB.get();
          db2.sheets[db2.active].colW[letter_] = Math.max(30, startW + e2.clientX - startX);
          xlDB.set(db2); xlRender();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      })(th, colLetter(c)));
      th.appendChild(colResizer);
      hr.appendChild(th);
    }

    const tbody = tbl.createTBody();
    for (let r = 0; r < rows; r++) {
      const row = tbody.insertRow();
      // 행 높이: 해당 행의 최대 글씨 크기 기준 자동계산, 또는 사용자가 드래그로 지정한 값
      let maxFontSz = 0;
      for (let c2 = 0; c2 < cols; c2++) {
        const c2ell = data[colLetter(c2) + (r + 1)];
        if (c2ell && c2ell.s) maxFontSz = Math.max(maxFontSz, parseInt(c2ell.s) || 0);
      }
      const autoH = maxFontSz ? Math.max(24, maxFontSz + 10) : 24;
      row.style.height = (rowH[r + 1] || autoH) + 'px';

      const rh = row.insertCell();
      rh.className = 'td-rh' + ((xlSelAll || xlSelRow === r) ? ' sel-row-full' : (xlSelRow === null && !xlSelAll && sel && sel.ri === r ? ' sel-row' : ''));
      rh.textContent = r + 1;
      rh.addEventListener('click', ((ri) => () => { if (xlEditing) xlCommit(); xlSelectRow(ri); })(r));
      const rowResizer = document.createElement('div');
      rowResizer.className = 'row-resizer';
      rowResizer.addEventListener('click', e => e.stopPropagation());
      rowResizer.addEventListener('mousedown', ((row_, ri_) => e => {
        e.stopPropagation(); e.preventDefault();
        const startY = e.clientY, startH = rowH[ri_ + 1] || autoH;
        const onMove = e2 => { row_.style.height = Math.max(16, startH + e2.clientY - startY) + 'px'; };
        const onUp = e2 => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          const newH = Math.max(16, startH + e2.clientY - startY);
          const db2 = xlDB.get();
          if (!db2.sheets[db2.active].rowH) db2.sheets[db2.active].rowH = {};
          db2.sheets[db2.active].rowH[ri_ + 1] = newH;
          xlDB.set(db2); xlRender();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      })(row, r));
      rh.appendChild(rowResizer);

      for (let c = 0; c < cols; c++) {
        const ref = colLetter(c) + (r + 1);
        if (covered.has(ref)) continue; // 병합된 셀 건너뜀
        const cell = data[ref];
        const td = row.insertCell();
        td.dataset.ref = ref;
        // 병합 colspan/rowspan
        const mg = xlMergeAt(merges, r, c);
        if (mg) { td.colSpan = mg.c2-mg.c1+1; td.rowSpan = mg.r2-mg.r1+1; }
        if (xlSelAll || xlSelCol === c) td.classList.add('sel-col-full');
        if (!xlSelAll && xlSelRow === r) td.classList.add('sel-row-full');
        if (sel && sel.ci === c && sel.ri === r) td.classList.add('sel');
        if (xlHasRange()) { const b=xlRangeBounds(); if (r>=b.rMin&&r<=b.rMax&&c>=b.cMin&&c<=b.cMax) td.classList.add('in-range'); }
        if (xlClipboard && xlClipboard.type==='cut' && xlClipboard.origRefs && xlClipboard.origRefs.includes(ref)) td.classList.add('cut-cell');

        const span = document.createElement('span');
        span.className = 'cell-val';
        const dv = xlDisplay(ref, data);
        span.textContent = dv !== null && dv !== undefined ? dv : '';
        if (cell) {
          if (cell.bg) td.style.backgroundColor = cell.bg;
          if (cell.tc) span.style.color = cell.tc;
          if (cell.b) span.style.fontWeight = 'bold';
          if (cell.i) span.style.fontStyle = 'italic';
          if (cell.a) { td.style.textAlign = cell.a; span.style.textAlign = cell.a; }
          else if (typeof dv === 'number') { td.style.textAlign = 'right'; span.style.textAlign = 'right'; }
          if (cell.s) span.style.fontSize = cell.s + 'px';
          if (cell.bd) {
            if (cell.bd.t) td.style.borderTop    = cell.bd.t;
            if (cell.bd.b) td.style.borderBottom = cell.bd.b;
            if (cell.bd.l) td.style.borderLeft   = cell.bd.l;
            if (cell.bd.r) td.style.borderRight  = cell.bd.r;
          }
        } else if (typeof dv === 'number') {
          td.style.textAlign = 'right'; span.style.textAlign = 'right';
        }

        td.appendChild(span);
        td.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          if (xlEditing) xlCommit();
          if (e.shiftKey) {
            if (!xlRangeStart) xlRangeStart = xlSel;
            xlRangeEnd = ref;
            xlSelCol = null; xlSelRow = null; xlSelAll = false;
            xlRender(); xlSelectHighlight();
          } else {
            xlIsDragging = true;
            xlRangeStart = ref;
            xlRangeEnd = null;
            xlSel = ref;
            xlSelCol = null; xlSelRow = null; xlSelAll = false;
            xlRender(); xlSelectHighlight();
          }
        });
        td.addEventListener('mouseenter', () => {
          if (!xlIsDragging) return;
          if (ref === xlRangeEnd) return;
          xlRangeEnd = ref;
          xlSel = xlRangeStart;
          xlRender(); xlSelectHighlight();
        });
        td.addEventListener('dblclick', (e) => { e.stopPropagation(); xlStartEdit(ref); });
      }
    }

    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    xlScrollToSel();
    xlRenderTabs();
  }

  function xlScrollToSel() {
    const td = document.querySelector(`.sheet-tbl td[data-ref="${xlSel}"]`);
    if (td) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  /* ─ 탭 렌더링 ─ */
  function xlRenderTabs() {
    const db = xlDB.get();
    const bar = document.getElementById('xl-tabs');
    bar.innerHTML = '';

    db.sheets.forEach((sheet, idx) => {
      const tab = document.createElement('div');
      tab.className = 'sheet-tab' + (idx === db.active ? ' active' : '');

      const nameSpan = document.createElement('span');
      nameSpan.textContent = sheet.name;
      tab.appendChild(nameSpan);

      // 삭제 버튼 (탭이 2개 이상일 때만)
      if (db.sheets.length > 1) {
        const del = document.createElement('button');
        del.className = 'tab-del';
        del.textContent = '×';
        del.title = '탭 삭제';
        del.onclick = (e) => { e.stopPropagation(); xlDeleteSheet(idx); };
        tab.appendChild(del);
      }

      tab.onclick = () => xlSwitchSheet(idx);
      tab.ondblclick = (e) => { e.stopPropagation(); e.preventDefault(); xlRenameSheet(idx); };
      bar.appendChild(tab);
    });

    // + 버튼
    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.textContent = '+';
    addBtn.title = '새 탭 추가';
    addBtn.onclick = xlAddSheet;
    bar.appendChild(addBtn);
  }

  /* ─ 탭 전환 ─ */
  function xlSwitchSheet(idx) {
    if (xlEditing) xlCommit();
    const db = xlDB.get();
    if (db.active === idx) return; // 이미 해당 탭이면 DOM 재구성 스킵 (dblclick rename 보호)
    db.active = idx;
    xlDB.set(db);
    xlSel = 'A1'; xlSelCol = null; xlSelRow = null; xlSelAll = false;
    xlRangeStart = null; xlRangeEnd = null; xlClipboard = null;
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 탭 추가 ─ */
  function xlAddSheet() {
    const db = xlDB.get();
    const num = db.sheets.length + 1;
    db.sheets.push(xlNewSheet('Sheet ' + num));
    db.active = db.sheets.length - 1;
    xlDB.set(db);
    xlSel = 'A1';
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 탭 삭제 ─ */
  function xlDeleteSheet(idx) {
    const db = xlDB.get();
    if (db.sheets.length === 1) return;
    if (!confirm(`"${db.sheets[idx].name}" 탭을 삭제할까요?`)) return;
    db.sheets.splice(idx, 1);
    db.active = Math.min(db.active, db.sheets.length - 1);
    xlDB.set(db);
    xlSel = 'A1';
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 탭 이름 변경 ─ */
  function xlRenameSheet(idx) {
    const bar = document.getElementById('xl-tabs');
    const tabEls = bar.querySelectorAll('.sheet-tab');
    const tabEl = tabEls[idx];
    if (!tabEl) return;
    // 이미 편집 중이면 중복 실행 방지
    if (tabEl.querySelector('input.tab-name-input')) return;
    const nameSpan = tabEl.querySelector('span');
    if (!nameSpan) return;

    const db = xlDB.get();
    const inp = document.createElement('input');
    inp.className = 'tab-name-input';
    inp.value = db.sheets[idx].name;
    nameSpan.replaceWith(inp);

    // DOM 업데이트 후 포커스 (즉시 blur 방지)
    setTimeout(() => { inp.focus(); inp.select(); }, 0);

    let saved = false;
    const save = () => {
      if (saved) return;
      saved = true;
      const db2 = xlDB.get();
      const newName = inp.value.trim();
      if (newName) db2.sheets[idx].name = newName;
      xlDB.set(db2);
      xlRenderTabs();
    };
    inp.addEventListener('blur', save);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'Escape') { saved = true; xlRenderTabs(); }
    });
  }

  /* ─ 셀 선택 ─ */
  function xlSelect(ref) {
    xlEditing = false;
    xlSelCol = null;
    xlSelRow = null;
    xlSelAll = false;
    xlRangeStart = null;
    xlRangeEnd = null;
    xlSel = ref.toUpperCase();
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 컬럼 전체 선택 ─ */
  function xlSelectCol(c) {
    xlSelCol = c;
    xlSelRow = null;
    xlSelAll = false;
    xlEditing = false;
    xlRangeStart = null; xlRangeEnd = null;
    xlSel = colLetter(c) + '1';
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 행 전체 선택 ─ */
  function xlSelectRow(r) {
    xlSelRow = r;
    xlSelCol = null;
    xlSelAll = false;
    xlEditing = false;
    xlRangeStart = null; xlRangeEnd = null;
    xlSel = 'A' + (r + 1);
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 전체 선택 ─ */
  function xlSelectAll() {
    xlSelAll = true;
    xlSelCol = null;
    xlSelRow = null;
    xlEditing = false;
    xlRangeStart = null; xlRangeEnd = null;
    xlSel = 'A1';
    xlRender();
    xlSelectHighlight();
  }

  /* ─ 복사 / 잘라내기 ─ */
  function xlCopy(type) {
    const { sh } = xlDB.sh();
    const refs = xlGetSelRefs(sh);
    if (!refs.length) return;
    const parsed = refs.map(r => ({ ref: r, p: parseRef(r) })).filter(x => x.p);
    const rMin = Math.min(...parsed.map(x => x.p.ri));
    const cMin = Math.min(...parsed.map(x => x.p.ci));
    const rMax = Math.max(...parsed.map(x => x.p.ri));
    const cMax = Math.max(...parsed.map(x => x.p.ci));
    xlClipboard = {
      cells: parsed.map(({ ref, p }) => ({ dr: p.ri - rMin, dc: p.ci - cMin, data: sh.data[ref] ? { ...sh.data[ref] } : null })),
      rowCount: rMax - rMin + 1, colCount: cMax - cMin + 1,
      type, origRefs: refs
    };
    xlRender(); xlSelectHighlight();
  }

  /* ─ 붙여넣기 ─ */
  function xlPaste() {
    if (!xlClipboard) return;
    const dest = parseRef(xlSel);
    if (!dest) return;
    const db = xlDB.get(); const sh = db.sheets[db.active];
    xlClipboard.cells.forEach(({ dr, dc, data }) => {
      const r = dest.ri + dr, c = dest.ci + dc;
      if (r >= sh.rows || c >= sh.cols) return;
      const ref = colLetter(c) + (r + 1);
      if (data) sh.data[ref] = { ...data };
      else delete sh.data[ref];
    });
    if (xlClipboard.type === 'cut') {
      xlClipboard.origRefs.forEach(ref => { delete sh.data[ref]; });
      xlClipboard = null;
    }
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  /* ─ 병합 / 해제 ─ */
  function xlMerge() {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    if (!sh.merges) sh.merges = [];
    const sel = parseRef(xlSel);
    if (!sel) return;

    // 이미 병합된 셀이면 해제
    const existing = xlMergeAt(sh.merges, sel.ri, sel.ci);
    if (existing) {
      sh.merges = sh.merges.filter(m => m !== existing);
      xlDB.set(db); xlRender(); xlSelectHighlight();
      return;
    }

    // 범위가 없으면 무시
    if (!xlHasRange()) return;
    const b = xlRangeBounds();
    if (!b) return;

    // 겹치는 기존 병합 제거
    sh.merges = sh.merges.filter(m =>
      m.r2 < b.rMin || m.r1 > b.rMax || m.c2 < b.cMin || m.c1 > b.cMax
    );

    // 병합 영역 내 좌상단 제외 셀 데이터 삭제
    for (let r = b.rMin; r <= b.rMax; r++)
      for (let c = b.cMin; c <= b.cMax; c++)
        if (r !== b.rMin || c !== b.cMin) delete sh.data[colLetter(c) + (r + 1)];

    sh.merges.push({ r1: b.rMin, c1: b.cMin, r2: b.rMax, c2: b.cMax });
    xlRangeStart = null; xlRangeEnd = null;
    xlSel = colLetter(b.cMin) + (b.rMin + 1);
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  /* ─ 테두리 ─ */
  const BD_THIN  = '1px solid #555';
  const BD_THICK = '2px solid #111';

  function xlSetBorder(type) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    const parsed = refs.map(r => parseRef(r)).filter(Boolean);
    const rMin = Math.min(...parsed.map(p => p.ri));
    const rMax = Math.max(...parsed.map(p => p.ri));
    const cMin = Math.min(...parsed.map(p => p.ci));
    const cMax = Math.max(...parsed.map(p => p.ci));

    refs.forEach(ref => {
      const p = parseRef(ref); if (!p) return;
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      const c = sh.data[ref];
      if (type === 'none') {
        delete c.bd; xlCleanCell(sh, ref); return;
      }
      if (!c.bd) c.bd = {};
      if (type === 'all') {
        c.bd = {};
        if (p.ri === rMin) c.bd.t = BD_THIN; // 상단 행만 위 테두리
        c.bd.b = BD_THIN;
        if (p.ci === cMin) c.bd.l = BD_THIN; // 좌측 열만 왼 테두리
        c.bd.r = BD_THIN;
      } else if (type === 'outer' || type === 'thick-outer') {
        const s = type === 'thick-outer' ? BD_THICK : BD_THIN;
        if (!c.bd) c.bd = {};
        if (p.ri === rMin) c.bd.t = s;
        if (p.ri === rMax) c.bd.b = s;
        if (p.ci === cMin) c.bd.l = s;
        if (p.ci === cMax) c.bd.r = s;
        if (!c.bd.t && !c.bd.b && !c.bd.l && !c.bd.r) delete c.bd;
        xlCleanCell(sh, ref); return;
      }
    });
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  function toggleBorderDrop() {
    document.getElementById('xl-border-drop').classList.toggle('open');
  }
  function closeBorderDrop() {
    document.getElementById('xl-border-drop').classList.remove('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.xl-border-wrap')) closeBorderDrop();
  });

  /* ─ 편집 시작 ─ */
  function xlStartEdit(ref, prefill) {
    xlSel = ref.toUpperCase();
    xlEditing = true;
    const td = document.querySelector(`.sheet-tbl td[data-ref="${xlSel}"]`);
    if (!td) return;

    td.innerHTML = '';
    const inp = document.createElement('input');
    inp.className = 'cell-edit-input';
    inp.id = 'xl-cell-inp';
    const { sh } = xlDB.sh();
    const cell = sh.data[xlSel];
    inp.value = prefill !== undefined ? prefill : (cell ? (cell.f || (cell.v ?? '')) : '');
    td.appendChild(inp);
    inp.focus();
    if (prefill === undefined) inp.select();

    document.getElementById('xl-addr').textContent = xlSel;
    document.getElementById('xl-formula').value = inp.value;
    inp.addEventListener('input', () => { document.getElementById('xl-formula').value = inp.value; });
    inp.addEventListener('blur', () => { if (xlEditing) xlCommit(); });
    inp.addEventListener('keydown', e => {
      const r = parseRef(xlSel); if (!r) return;
      if (e.key === 'Tab') {
        e.preventDefault(); e.stopPropagation();
        xlCommit();
        xlSelect(colLetter(Math.max(0, r.ci + (e.shiftKey ? -1 : 1))) + r.row);
      } else if (e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        xlCommit();
        xlSelect(colLetter(r.ci) + (r.row + 1));
      } else if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        xlEditing = false; xlRender(); xlSelectHighlight();
      }
    });
  }

  /* ─ 저장 ─ */
  function xlCommit() {
    xlEditing = false;
    const inp = document.getElementById('xl-cell-inp');
    if (!inp) return;
    const val = inp.value;
    const db = xlDB.get();
    const sh = db.sheets[db.active];
    if (!sh.data[xlSel]) sh.data[xlSel] = {};
    if (val.startsWith('=')) { sh.data[xlSel].f = val; sh.data[xlSel].v = ''; }
    else { sh.data[xlSel].v = val; sh.data[xlSel].f = ''; }
    const c = sh.data[xlSel];
    if (!val && !c.b && !c.i && !c.a && !c.s) delete sh.data[xlSel];
    xlDB.set(db);
    xlRender();
    xlSelectHighlight();
  }

  function xlSelectHighlight() {
    const { sh } = xlDB.sh();
    const cell = sh.data[xlSel];
    document.getElementById('xl-addr').textContent = xlSel;
    document.getElementById('xl-formula').value = cell ? (cell.f || (cell.v ?? '')) : '';
    document.getElementById('xl-bold').classList.toggle('active',   !!(cell&&cell.b));
    document.getElementById('xl-italic').classList.toggle('active', !!(cell&&cell.i));
    document.getElementById('xl-left').classList.toggle('active',   !!(cell&&cell.a==='left'));
    document.getElementById('xl-center').classList.toggle('active', !!(cell&&cell.a==='center'));
    document.getElementById('xl-right').classList.toggle('active',  !!(cell&&cell.a==='right'));
    document.getElementById('xl-size').value = (cell&&cell.s) ? cell.s : '';
    const sw = document.getElementById('xl-bg-swatch');
    if (sw) sw.style.background = (cell&&cell.bg) ? cell.bg : '';
    const tsw = document.getElementById('xl-tc-swatch');
    if (tsw) tsw.style.background = (cell&&cell.tc) ? cell.tc : '#e74c3c';
    const mBtn = document.getElementById('xl-merge');
    if (mBtn) { const s=parseRef(xlSel); const {sh:sh2}=xlDB.sh(); mBtn.classList.toggle('active', !!(s&&xlMergeAt(sh2.merges||[],s.ri,s.ci))); }
  }

  /* ─ 서식 ─ */
  function xlCleanCell(sh, ref) {
    const c = sh.data[ref];
    if (c && !c.v && !c.f && !c.b && !c.i && !c.a && !c.s && !c.bg && !c.tc && !c.bd) delete sh.data[ref];
  }

  function xlGetSelRefs(sh) {
    if (xlSelAll) {
      const refs = [];
      for (let r = 0; r < sh.rows; r++)
        for (let c = 0; c < sh.cols; c++)
          refs.push(colLetter(c) + (r + 1));
      return refs;
    }
    if (xlSelCol !== null)
      return Array.from({length: sh.rows}, (_, r) => colLetter(xlSelCol) + (r + 1));
    if (xlSelRow !== null)
      return Array.from({length: sh.cols}, (_, c) => colLetter(c) + (xlSelRow + 1));
    if (xlHasRange()) {
      const b = xlRangeBounds(); const refs = [];
      for (let r = b.rMin; r <= b.rMax; r++)
        for (let c = b.cMin; c <= b.cMax; c++)
          refs.push(colLetter(c) + (r + 1));
      return refs;
    }
    return [xlSel];
  }

  function xlFormat(prop) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    const newVal = !(sh.data[xlSel] && sh.data[xlSel][prop]);
    refs.forEach(ref => {
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      if (newVal) sh.data[ref][prop] = true;
      else delete sh.data[ref][prop];
      xlCleanCell(sh, ref);
    });
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }
  function xlAlign(a) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    const curA = sh.data[xlSel] ? sh.data[xlSel].a : '';
    const newA = (curA === a) ? '' : a;
    refs.forEach(ref => {
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      sh.data[ref].a = newA;
      xlCleanCell(sh, ref);
    });
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }
  function xlSetBg(color) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    refs.forEach(ref => {
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      if (color) sh.data[ref].bg = color;
      else delete sh.data[ref].bg;
      xlCleanCell(sh, ref);
    });
    if (color) {
      const sw = document.getElementById('xl-bg-swatch');
      if (sw) sw.style.background = color;
    }
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  function xlSetTc(color) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    refs.forEach(ref => {
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      if (color) sh.data[ref].tc = color;
      else delete sh.data[ref].tc;
      xlCleanCell(sh, ref);
    });
    if (color) {
      const sw = document.getElementById('xl-tc-swatch');
      if (sw) sw.style.background = color;
    }
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  function xlSetSize(sz) {
    const db = xlDB.get(); const sh = db.sheets[db.active];
    const refs = xlGetSelRefs(sh);
    refs.forEach(ref => {
      if (!sh.data[ref]) sh.data[ref] = { v: '', f: '' };
      sh.data[ref].s = sz || '';
      xlCleanCell(sh, ref);
    });
    xlDB.set(db); xlRender(); xlSelectHighlight();
  }

  /* ─ 행/열 추가 ─ */
  function xlAddRow() { const db=xlDB.get(); db.sheets[db.active].rows++; xlDB.set(db); xlRender(); }
  function xlAddCol() { const db=xlDB.get(); db.sheets[db.active].cols++; xlDB.set(db); xlRender(); }

  /* ─ 키보드 ─ */
  document.addEventListener('keydown', e => {
    if (document.getElementById('view-excel').style.display === 'none') return;
    // 탭 이름 편집 중이면 키 이벤트 무시
    if (document.activeElement && document.activeElement.classList.contains('tab-name-input')) return;
    const ref = parseRef(xlSel);
    if (!ref) return;

    if (xlEditing) return;

    const move = (ci, ri) => xlSelect(colLetter(Math.max(0,ref.ci+ci)) + Math.max(1,ref.row+ri));
    switch(e.key) {
      case 'ArrowUp':    e.preventDefault(); move(0,-1); break;
      case 'ArrowDown':  e.preventDefault(); move(0,1);  break;
      case 'ArrowLeft':  e.preventDefault(); move(-1,0); break;
      case 'ArrowRight': e.preventDefault(); move(1,0);  break;
      case 'Tab':   e.preventDefault(); move(e.shiftKey?-1:1, 0); break;
      case 'Enter': e.preventDefault(); xlStartEdit(xlSel); break;
      case 'Delete': case 'Backspace':
        e.preventDefault();
        const db=xlDB.get(); const sh=db.sheets[db.active];
        xlGetSelRefs(sh).forEach(dref => {
          if (sh.data[dref]) { sh.data[dref].v=''; sh.data[dref].f=''; const cc=sh.data[dref]; if(!cc.b&&!cc.i&&!cc.a&&!cc.s&&!cc.bg&&!cc.tc) delete sh.data[dref]; }
        });
        xlDB.set(db); xlRender(); xlSelectHighlight();
        break;
      default:
        if (e.key.length===1 && !e.ctrlKey && !e.metaKey) { e.preventDefault(); xlStartEdit(xlSel, e.key); }
    }
    if ((e.ctrlKey||e.metaKey) && e.key==='b') { e.preventDefault(); xlFormat('b'); }
    if ((e.ctrlKey||e.metaKey) && e.key==='i') { e.preventDefault(); xlFormat('i'); }
    if ((e.ctrlKey||e.metaKey) && e.key==='x') { e.preventDefault(); xlCopy('cut'); }
    if ((e.ctrlKey||e.metaKey) && e.key==='c') { e.preventDefault(); xlCopy('copy'); }
    if ((e.ctrlKey||e.metaKey) && e.key==='v') { e.preventDefault(); xlPaste(); }
  });

  document.addEventListener('mouseup', () => { xlIsDragging = false; });

  /* ─ 수식 바 Enter ─ */
  document.getElementById('xl-formula').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const val = e.target.value;
    const db = xlDB.get(); const sh = db.sheets[db.active];
    if (!sh.data[xlSel]) sh.data[xlSel] = {};
    if (val.startsWith('=')) { sh.data[xlSel].f = val; sh.data[xlSel].v = ''; }
    else { sh.data[xlSel].v = val; sh.data[xlSel].f = ''; }
    const c = sh.data[xlSel];
    if (!val && !c.b && !c.i && !c.a && !c.s) delete sh.data[xlSel];
    xlDB.set(db); xlRender(); xlSelectHighlight();
  });

  function openExcel() {
    showView('view-excel');
    xlSel = 'A1';
    xlRender();
    xlSelectHighlight();
  }

  /* ─── 초기화 ─── */
  showView('view-main');
</script>
</body>
</html>
