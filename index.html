<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일상</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f6fa;
      color: #222;
      height: 100vh;
      overflow: hidden;
    }

    /* ───────── 메인(일상) ───────── */
    #view-main {
      padding: 52px 60px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .main-title { font-size: 2em; font-weight: 800; color: #1a1a2e; letter-spacing: -0.02em; }
    .menu-list { display: flex; flex-direction: column; gap: 10px; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border: 1.5px solid #e4e8f5;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.13s;
      max-width: 480px;
    }
    .menu-item:hover { border-color: #2a4898; box-shadow: 0 2px 12px rgba(42,72,152,0.1); transform: translateX(3px); }
    .menu-num { font-size: 12px; font-weight: 700; color: #bbb; width: 20px; text-align: center; flex-shrink: 0; }
    .menu-name { font-size: 15px; font-weight: 600; color: #222; flex: 1; }
    .menu-arrow { color: #ccc; font-size: 16px; }
    .menu-item:hover .menu-arrow { color: #2a4898; }

    /* ───────── 공통 상단 ───────── */
    .view-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 32px 0;
      flex-shrink: 0;
    }
    .btn-back {
      font-size: 12px; color: #999; background: none; border: none;
      cursor: pointer; padding: 0; font-family: inherit; display: flex; align-items: center; gap: 4px;
    }
    .btn-back:hover { color: #2a4898; }
    .view-h-title { font-size: 1.3em; font-weight: 700; color: #1a3570; }

    /* ───────── 성경필사 ───────── */
    #view-bible {
      height: 100vh;
      display: none;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }
    .testament-block { display: flex; flex-direction: column; gap: 10px; padding: 0 32px; }
    .testament-label { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.12em; text-transform: uppercase; }
    .book-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .book-btn {
      padding: 8px 14px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 8px;
      font-size: 13px; font-weight: 500; color: #2a4898; cursor: pointer; transition: all 0.13s;
      min-width: 66px; text-align: center;
    }
    .book-btn:hover { background: #2a4898; color: #fff; border-color: #2a4898; }
    .book-btn.written { background: #eef1ff; border-color: #a8b8ef; }

    /* ───────── 책 상세 ───────── */
    #view-book { display: none; height: 100vh; }
    .book-layout { display: flex; height: 100%; }
    .sidebar {
      width: 210px; min-width: 210px; background: #fff;
      border-right: 1px solid #e4e9f5; display: flex; flex-direction: column;
    }
    .sidebar-top { padding: 18px 16px 14px; border-bottom: 1px solid #e4e9f5; }
    .sidebar-book-name { font-size: 1.1em; font-weight: 700; color: #1a3570; }
    .chapter-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .chapter-item { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; }
    .chapter-item:hover { background: #f4f6ff; }
    .chapter-item.active { background: #eef1ff; border-left-color: #2a4898; }
    .ch-name { font-size: 13px; font-weight: 600; color: #2a4898; }
    .ch-date { font-size: 11px; color: #bbb; margin-top: 2px; }
    .sidebar-empty { padding: 20px 16px; font-size: 12px; color: #ccc; line-height: 1.7; text-align: center; }
    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #state-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .empty-text { font-size: 14px; color: #ccc; }
    .btn-write-main {
      padding: 13px 36px; background: #2a4898; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(42,72,152,0.22);
    }
    .btn-write-main:hover { background: #1a3570; }
    #state-read { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .read-topbar {
      padding: 24px 40px 18px; border-bottom: 1px solid #e4e9f5;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .read-ch-title { font-size: 1.5em; font-weight: 700; color: #1a3570; }
    .read-ch-date { font-size: 12px; color: #bbb; margin-top: 4px; }
    .read-actions { display: flex; gap: 8px; }
    .btn-delete { padding: 7px 16px; background: #fff; border: 1.5px solid #f0d0d0; border-radius: 7px; font-size: 13px; color: #c0392b; cursor: pointer; }
    .btn-delete:hover { background: #fff0f0; border-color: #c0392b; }
    .btn-edit { padding: 7px 16px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 7px; font-size: 13px; color: #555; cursor: pointer; }
    .btn-edit:hover { background: #f0f3ff; color: #2a4898; border-color: #a8b8ef; }
    .btn-write-sm { padding: 7px 16px; background: #2a4898; color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-write-sm:hover { background: #1a3570; }
    .read-body { flex: 1; overflow-y: auto; padding: 28px 40px 60px; font-size: 15px; line-height: 2.1; color: #333; white-space: pre-wrap; }
    #state-editor { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .editor-topbar { padding: 20px 40px 16px; border-bottom: 2px solid #e4e9f5; display: flex; align-items: center; gap: 12px; }
    #input-title { font-size: 1.5em; font-weight: 700; color: #1a3570; border: none; outline: none; background: transparent; width: 180px; font-family: inherit; }
    #input-title::placeholder { color: #ddd; font-weight: 400; }
    .editor-btns { margin-left: auto; display: flex; gap: 8px; }
    .btn-cancel { padding: 7px 14px; background: #fff; border: 1.5px solid #dce3f5; border-radius: 7px; font-size: 13px; color: #777; cursor: pointer; }
    .btn-save { padding: 7px 22px; background: #2a4898; color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #1a3570; }
    #input-content { flex: 1; padding: 24px 40px 60px; border: none; outline: none; resize: none; font-size: 15px; line-height: 2.1; color: #333; background: transparent; font-family: inherit; }
    #input-content::placeholder { color: #ddd; }

    /* ───────── 일상 기록 ───────── */
    #view-daily {
      height: 100vh;
      display: none;
      flex-direction: column;
    }
    .daily-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid #e4e8f5;
      background: #fff;
    }
    .daily-left { display: flex; align-items: center; gap: 14px; }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    .btn-week {
      padding: 5px 12px; background: #fff; border: 1.5px solid #dce3f5;
      border-radius: 6px; font-size: 12px; color: #555; cursor: pointer; font-family: inherit;
    }
    .btn-week:hover { background: #f0f3ff; color: #2a4898; border-color: #a8b8ef; }
    .week-label { font-size: 13px; font-weight: 600; color: #444; min-width: 120px; text-align: center; }
    .daily-actions { display: flex; align-items: center; gap: 8px; }
    .btn-add-habit {
      padding: 6px 14px; background: #fff; border: 1.5px dashed #c0cae8;
      border-radius: 7px; font-size: 12px; color: #888; cursor: pointer; font-family: inherit;
    }
    .btn-add-habit:hover { border-color: #2a4898; color: #2a4898; }
    .btn-edit-mode {
      padding: 6px 14px; background: #fff; border: 1.5px solid #dce3f5;
      border-radius: 7px; font-size: 12px; color: #888; cursor: pointer; font-family: inherit;
    }
    .btn-edit-mode.active { background: #eef1ff; color: #2a4898; border-color: #a8b8ef; }

    /* 테이블 */
    .table-wrapper {
      flex: 1;
      overflow: auto;
      background: #fff;
    }
    .habit-table {
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 100%;
    }
    .habit-table th {
      background: #f4f6ff;
      font-size: 12px;
      font-weight: 700;
      color: #555;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid #dde3f5;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
    .habit-table th.col-habit {
      width: 155px;
      min-width: 155px;
      left: 0;
      z-index: 3;
      text-align: left;
      padding-left: 14px;
    }
    .habit-table th.today-col { background: #dce8ff; color: #2a4898; }
    .habit-table td {
      border: 1px solid #dde3f5;
      vertical-align: top;
      padding: 0;
      min-width: 110px;
    }
    .habit-table td.habit-name-cell {
      background: #fafbff;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      padding: 0;
      position: sticky;
      left: 0;
      z-index: 1;
      width: 155px;
      min-width: 155px;
    }
    .habit-name-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px 10px 14px;
      min-height: 52px;
      gap: 4px;
    }
    .habit-name-text { flex: 1; line-height: 1.4; outline: none; }
    .edit-mode .habit-name-text { border-bottom: 1px dashed #a8b8ef; cursor: text; }
    .btn-del-habit {
      display: none;
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .edit-mode .btn-del-habit { display: block; }
    /* 하루 메모 행 */
    .memo-row td { background: #f9fbff; }
    .memo-row td.habit-name-cell { background: #f0f4ff; }
    .memo-label {
      padding: 10px 10px 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #7b8fc7;
      letter-spacing: 0.03em;
    }
    .memo-cell-input {
      min-height: 80px;
      padding: 10px;
      font-size: 12px;
      color: #444;
      outline: none;
      line-height: 1.6;
      font-family: inherit;
      width: 100%;
      display: block;
      word-break: break-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .memo-cell-input:focus { background: #eef3ff; }
    .memo-cell-input:empty:before { content: attr(data-placeholder); color: #ccc; pointer-events: none; }
    .cell-check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px 5px;
      border-bottom: 1px solid #eef0f8;
      cursor: pointer;
    }
    .cell-checkbox {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: #2a4898;
      flex-shrink: 0;
    }
    .cell-check-label {
      font-size: 11px;
      color: #ccc;
      user-select: none;
    }
    .cell-check-label.done { color: #2a4898; font-weight: 700; }
    .cell-text {
      padding: 5px 10px 8px;
      font-size: 12px;
      color: #444;
      outline: none;
      min-height: 38px;
      line-height: 1.6;
      font-family: inherit;
      width: 100%;
      display: block;
    }
    .cell-text:focus { background: #f0f5ff; }
    .cell-text:empty:before { content: attr(data-placeholder); color: #ddd; pointer-events: none; }
    .habit-table tr:hover td { background: #fafcff; }
    .habit-table tr:hover td.habit-name-cell { background: #f4f6ff; }
    .habit-table td.today-col { background: #f8faff; }
  </style>
</head>
<body>

<!-- ───── 일상 메인 ───── -->
<div id="view-main">
  <div class="main-title">일상</div>
  <div class="menu-list">
    <div class="menu-item" onclick="openBible()">
      <span class="menu-num">1</span>
      <span class="menu-name">성경필사</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="openDaily()">
      <span class="menu-num">2</span>
      <span class="menu-name">일상</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>
</div>

<!-- ───── 성경필사 ───── -->
<div id="view-bible">
  <div class="view-header">
    <button class="btn-back" onclick="goMain()">← 일상</button>
    <div class="view-h-title">성경필사</div>
  </div>
  <div class="testament-block">
    <div class="testament-label">구약성경 (39권)</div>
    <div class="book-grid" id="ot-grid"></div>
  </div>
  <div class="testament-block">
    <div class="testament-label">신약성경 (27권)</div>
    <div class="book-grid" id="nt-grid"></div>
  </div>
</div>

<!-- ───── 책 상세 ───── -->
<div id="view-book">
  <div class="book-layout">
    <div class="sidebar">
      <div class="sidebar-top">
        <button class="btn-back" style="margin-bottom:10px" onclick="openBible()">← 성경 목록</button>
        <div class="sidebar-book-name" id="sidebar-title"></div>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
    </div>
    <div class="main-panel">
      <div id="state-empty">
        <div class="empty-text">아직 작성한 내용이 없습니다</div>
        <button class="btn-write-main" onclick="openEditor()">작성하기</button>
      </div>
      <div id="state-read">
        <div class="read-topbar">
          <div>
            <div class="read-ch-title" id="read-ch-title"></div>
            <div class="read-ch-date" id="read-ch-date"></div>
          </div>
          <div class="read-actions">
            <button class="btn-delete" onclick="deleteChapter()">삭제</button>
            <button class="btn-edit" onclick="openEditor(true)">수정</button>
            <button class="btn-write-sm" onclick="openEditor()">+ 새 장 작성</button>
          </div>
        </div>
        <div class="read-body" id="read-body"></div>
      </div>
      <div id="state-editor">
        <div class="editor-topbar">
          <input id="input-title" type="text" placeholder="1장" maxlength="20" />
          <div class="editor-btns">
            <button class="btn-cancel" onclick="cancelEdit()">취소</button>
            <button class="btn-save" onclick="saveChapter()">저장</button>
          </div>
        </div>
        <textarea id="input-content" placeholder="내용을 입력하세요..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- ───── 일상 기록 ───── -->
<div id="view-daily">
  <div class="daily-topbar">
    <div class="daily-left">
      <button class="btn-back" onclick="goMain()">← 일상</button>
      <div class="view-h-title">일상 기록</div>
    </div>
    <div class="week-nav">
      <button class="btn-week" onclick="moveWeek(-1)">‹ 이전</button>
      <div class="week-label" id="week-label"></div>
      <button class="btn-week" onclick="moveWeek(1)">다음 ›</button>
    </div>
    <div class="daily-actions">
      <button class="btn-edit-mode" id="btn-edit-mode" onclick="toggleEditMode()">편집</button>
      <button class="btn-add-habit" onclick="addHabit()">+ 항목 추가</button>
    </div>
  </div>
  <div class="table-wrapper" id="table-wrapper"></div>
</div>

<script>
  /* ════════ 공통 ════════ */
  const OT = ['창세기','출애굽기','레위기','민수기','신명기','여호수아','사사기','룻기',
    '사무엘상','사무엘하','열왕기상','열왕기하','역대상','역대하','에스라','느헤미야',
    '에스더','욥기','시편','잠언','전도서','아가','이사야','예레미야','예레미야애가',
    '에스겔','다니엘','호세아','요엘','아모스','오바댜','요나','미가','나훔','하박국',
    '스바냐','학개','스가랴','말라기'];
  const NT = ['마태복음','마가복음','누가복음','요한복음','사도행전','로마서','고린도전서',
    '고린도후서','갈라디아서','에베소서','빌립보서','골로새서','데살로니가전서',
    '데살로니가후서','디모데전서','디모데후서','디도서','빌레몬서','히브리서','야고보서',
    '베드로전서','베드로후서','요한일서','요한이서','요한삼서','유다서','요한계시록'];

  const DAY_KO = ['일','월','화','수','목','금','토'];

  function showView(id) {
    ['view-main','view-bible','view-book','view-daily'].forEach(v => {
      const el = document.getElementById(v);
      el.style.display = (v === id) ? 'flex' : 'none';
      if (v === 'view-book' && v === id) el.style.display = 'block';
    });
  }

  function goMain() { showView('view-main'); }

  /* ════════ 성경필사 ════════ */
  const BIBLE_KEY = 'bible_notes_v1';
  const bibleDB = {
    get: () => JSON.parse(localStorage.getItem(BIBLE_KEY) || '{}'),
    set: d  => localStorage.setItem(BIBLE_KEY, JSON.stringify(d))
  };
  let book = null, chapter = null, editMode = false;

  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }

  function openBible() {
    showView('view-bible');
    buildGrid(OT, 'ot-grid');
    buildGrid(NT, 'nt-grid');
  }

  function buildGrid(books, id) {
    const data = bibleDB.get();
    const el = document.getElementById(id);
    el.innerHTML = '';
    books.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'book-btn' + (data[b] ? ' written' : '');
      btn.textContent = b;
      btn.onclick = () => openBook(b);
      el.appendChild(btn);
    });
  }

  function openBook(b) {
    book = b; chapter = null;
    document.getElementById('view-book').style.display = 'block';
    ['view-main','view-bible','view-daily'].forEach(v => document.getElementById(v).style.display = 'none');
    document.getElementById('sidebar-title').textContent = b;
    showState('empty');
    renderList();
  }

  function renderList() {
    const chapters = bibleDB.get()[book] || {};
    const list = document.getElementById('chapter-list');
    const keys = Object.keys(chapters);
    if (!keys.length) { list.innerHTML = '<div class="sidebar-empty">작성한 장이 여기에 나타납니다</div>'; return; }
    list.innerHTML = '';
    keys.slice().reverse().forEach(ch => {
      const div = document.createElement('div');
      div.className = 'chapter-item' + (ch === chapter ? ' active' : '');
      div.innerHTML = `<div class="ch-name">${ch}</div><div class="ch-date">${fmtDate(chapters[ch].date)}</div>`;
      div.onclick = () => viewChapter(ch);
      list.appendChild(div);
    });
  }

  function showState(state) {
    document.getElementById('state-empty').style.display  = state === 'empty'  ? 'flex'  : 'none';
    document.getElementById('state-read').style.display   = state === 'read'   ? 'flex'  : 'none';
    document.getElementById('state-editor').style.display = state === 'editor' ? 'flex'  : 'none';
  }

  function viewChapter(ch) {
    const entry = bibleDB.get()[book][ch];
    chapter = ch;
    document.getElementById('read-ch-title').textContent = ch;
    document.getElementById('read-ch-date').textContent  = fmtDate(entry.date);
    document.getElementById('read-body').textContent     = entry.content;
    showState('read');
    renderList();
  }

  function openEditor(isEdit = false) {
    editMode = isEdit;
    if (isEdit && chapter) {
      const entry = bibleDB.get()[book][chapter];
      document.getElementById('input-title').value   = chapter;
      document.getElementById('input-content').value = entry.content;
    } else {
      document.getElementById('input-title').value   = '';
      document.getElementById('input-content').value = '';
    }
    showState('editor');
    document.getElementById('input-title').focus();
  }

  function cancelEdit() { chapter ? viewChapter(chapter) : showState('empty'); }

  function deleteChapter() {
    if (!confirm(`"${chapter}"을 삭제할까요?`)) return;
    const data = bibleDB.get();
    delete data[book][chapter];
    if (!Object.keys(data[book]).length) delete data[book];
    bibleDB.set(data);
    chapter = null;
    renderList();
    showState('empty');
  }

  function saveChapter() {
    const title   = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();
    if (!title)   { alert('장 이름을 입력해주세요  예) 1장'); return; }
    if (!content) { alert('내용을 입력해주세요'); return; }
    const data = bibleDB.get();
    if (!data[book]) data[book] = {};
    let date = new Date().toISOString();
    if (editMode && chapter) {
      if (data[book][chapter]) date = data[book][chapter].date;
      if (chapter !== title) delete data[book][chapter];
    }
    data[book][title] = { date, content };
    bibleDB.set(data);
    chapter = title;
    renderList();
    viewChapter(title);
  }

  /* ════════ 일상 기록 ════════ */
  const DAILY_KEY = 'daily_habits_v1';
  const DEFAULT_HABITS = [];

  const dailyDB = {
    get: () => {
      const d = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null')
             || { habits: [...DEFAULT_HABITS], records: {}, memos: {} };
      if (!d.memos) d.memos = {};
      return d;
    },
    set: d => localStorage.setItem(DAILY_KEY, JSON.stringify(d))
  };

  let weekOffset  = 0;
  let dailyEditMode = false;

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getWeekDays(offset) {
    const now  = new Date();
    const day  = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1) + offset * 7;
    const mon  = new Date(now);
    mon.setDate(diff);
    mon.setHours(0,0,0,0);
    return Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  }

  function isToday(d) {
    const t = new Date();
    return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
  }

  function openDaily() {
    showView('view-daily');
    weekOffset = 0;
    dailyEditMode = false;
    document.getElementById('btn-edit-mode').classList.remove('active');
    renderDaily();
  }

  function moveWeek(dir) { weekOffset += dir; renderDaily(); }

  function toggleEditMode() {
    dailyEditMode = !dailyEditMode;
    const btn = document.getElementById('btn-edit-mode');
    btn.classList.toggle('active', dailyEditMode);
    btn.textContent = dailyEditMode ? '완료' : '편집';
    renderDaily();
  }

  function addHabit() {
    const name = prompt('추가할 항목 이름을 입력하세요');
    if (!name || !name.trim()) return;
    const data = dailyDB.get();
    data.habits.push(name.trim());
    dailyDB.set(data);
    renderDaily();
  }

  function deleteHabit(habit) {
    if (!confirm(`"${habit}" 항목을 삭제할까요?`)) return;
    const data = dailyDB.get();
    data.habits = data.habits.filter(h => h !== habit);
    Object.values(data.records).forEach(rec => delete rec[habit]);
    dailyDB.set(data);
    renderDaily();
  }

  function renameHabit(oldName, newName) {
    newName = newName.trim();
    if (!newName || newName === oldName) return;
    const data = dailyDB.get();
    const idx = data.habits.indexOf(oldName);
    if (idx > -1) data.habits[idx] = newName;
    Object.keys(data.records).forEach(date => {
      if (data.records[date][oldName] !== undefined) {
        data.records[date][newName] = data.records[date][oldName];
        delete data.records[date][oldName];
      }
    });
    dailyDB.set(data);
    renderDaily();
  }

  function renderDaily() {
    const data = dailyDB.get();
    const days = getWeekDays(weekOffset);
    const wrapper = document.getElementById('table-wrapper');

    // 주 레이블
    const first = days[0], last = days[6];
    document.getElementById('week-label').textContent =
      `${first.getMonth()+1}/${first.getDate()} - ${last.getMonth()+1}/${last.getDate()}`;

    wrapper.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'habit-table' + (dailyEditMode ? ' edit-mode' : '');

    /* 헤더 */
    const thead = table.createTHead();
    const hRow  = thead.insertRow();
    const thH   = document.createElement('th');
    thH.textContent = '항목';
    thH.className   = 'col-habit';
    hRow.appendChild(thH);
    days.forEach(d => {
      const th = document.createElement('th');
      th.textContent = `${d.getMonth()+1}/${d.getDate()} ${DAY_KO[d.getDay()]}`;
      th.style.width    = '130px';
      th.style.minWidth = '130px';
      th.style.maxWidth = '130px';
      if (isToday(d)) th.classList.add('today-col');
      hRow.appendChild(th);
    });

    /* 하루 메모 행 */
    const tbody = table.createTBody();
    const memoRow = tbody.insertRow();
    memoRow.className = 'memo-row';
    const memoLabel = memoRow.insertCell();
    memoLabel.className = 'habit-name-cell';
    memoLabel.innerHTML = '<div class="memo-label">하루 메모</div>';
    days.forEach(d => {
      const key = dateKey(d);
      const memoVal = data.memos[key] || '';
      const td = memoRow.insertCell();
      if (isToday(d)) td.classList.add('today-col');
      const div = document.createElement('div');
      div.className = 'memo-cell-input';
      div.contentEditable = 'true';
      div.dataset.placeholder = '하루를 정리해보세요...';
      if (memoVal) div.innerHTML = memoVal.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      div.addEventListener('blur', () => {
        const d2 = dailyDB.get();
        const v = div.innerText.trim();
        if (v) d2.memos[key] = v;
        else   delete d2.memos[key];
        dailyDB.set(d2);
      });
      td.appendChild(div);
    });

    /* 습관 행 */
    data.habits.forEach(habit => {
      const row = tbody.insertRow();

      // 항목명 셀
      const tdName = row.insertCell();
      tdName.className = 'habit-name-cell';
      const inner = document.createElement('div');
      inner.className = 'habit-name-inner';
      const nameText = document.createElement('span');
      nameText.className = 'habit-name-text';
      nameText.textContent = habit;
      if (dailyEditMode) {
        nameText.contentEditable = 'true';
        nameText.addEventListener('blur', () => renameHabit(habit, nameText.textContent));
        nameText.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameText.blur(); } });
      }
      inner.appendChild(nameText);
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del-habit';
      delBtn.textContent = '×';
      delBtn.onclick = () => deleteHabit(habit);
      inner.appendChild(delBtn);
      tdName.appendChild(inner);

      // 날짜별 셀
      days.forEach(d => {
        const key   = dateKey(d);
        const saved = data.records[key]?.[habit] || {};
        const checked = saved.checked || false;
        const text    = saved.text    || '';

        const td = row.insertCell();
        if (isToday(d)) td.classList.add('today-col');

        // 체크 행
        const checkRow = document.createElement('div');
        checkRow.className = 'cell-check-row';

        const chk = document.createElement('input');
        chk.type      = 'checkbox';
        chk.className = 'cell-checkbox';
        chk.checked   = checked;

        const lbl = document.createElement('span');
        lbl.className = 'cell-check-label' + (checked ? ' done' : '');
        lbl.textContent = checked ? '완료' : '미완료';

        const save = () => {
          const d2 = dailyDB.get();
          if (!d2.records[key]) d2.records[key] = {};
          const t = textDiv.textContent.trim();
          if (!chk.checked && !t) delete d2.records[key][habit];
          else d2.records[key][habit] = { checked: chk.checked, text: t };
          dailyDB.set(d2);
        };

        chk.addEventListener('change', () => {
          lbl.textContent = chk.checked ? '완료' : '미완료';
          lbl.className   = 'cell-check-label' + (chk.checked ? ' done' : '');
          save();
        });
        checkRow.addEventListener('click', e => {
          if (e.target !== chk) { chk.checked = !chk.checked; chk.dispatchEvent(new Event('change')); }
        });

        checkRow.appendChild(chk);
        checkRow.appendChild(lbl);

        // 텍스트 입력
        const textDiv = document.createElement('div');
        textDiv.className       = 'cell-text';
        textDiv.contentEditable = 'true';
        textDiv.dataset.placeholder = '메모...';
        textDiv.textContent     = text;
        textDiv.addEventListener('blur', save);
        textDiv.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textDiv.blur(); } });

        td.appendChild(checkRow);
        td.appendChild(textDiv);
      });
    });

    wrapper.appendChild(table);
  }

  /* ─── 초기화 ─── */
  showView('view-main');
</script>
</body>
</html>
